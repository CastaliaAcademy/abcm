name: abcm

services:
  rest:
    working_dir: /app
    environment:
      ABCM_API_TOKEN: ${ABCM_API_TOKEN:?required}
      ABCM_HOST: 0.0.0.0
      ABCM_PORT: 8787
      ABCM_WORKSPACE_ID: ${ABCM_WORKSPACE_ID:-abcm-development}
      ABCM_WORKSPACE_ROOT: /workspace
      ABCM_WORKSPACE_STORE_ROOT: /workspaces
      ABCM_DERIVED_STORE_ENABLED: ${ABCM_DERIVED_STORE_ENABLED:-false}
      ABCM_DERIVED_STORE_SCAN_LEASE_TTL_MS: ${ABCM_DERIVED_STORE_SCAN_LEASE_TTL_MS:-30000}
      ABCM_DERIVED_STORE_SCAN_LEASE_RENEWAL_INTERVAL_MS: ${ABCM_DERIVED_STORE_SCAN_LEASE_RENEWAL_INTERVAL_MS:-10000}
      ABCM_DERIVED_STORE_OWNER_TTL_MS: ${ABCM_DERIVED_STORE_OWNER_TTL_MS:-30000}
      ABCM_DERIVED_STORE_OWNER_RENEWAL_INTERVAL_MS: ${ABCM_DERIVED_STORE_OWNER_RENEWAL_INTERVAL_MS:-10000}
      ABCM_SCOPE_MAP_RECONCILE_DEBOUNCE_MS: ${ABCM_SCOPE_MAP_RECONCILE_DEBOUNCE_MS:-50}
      ABCM_SCOPE_MAP_FULL_RECONCILE_INTERVAL_MS: ${ABCM_SCOPE_MAP_FULL_RECONCILE_INTERVAL_MS:-300000}
      ABCM_REST_MAX_REQUEST_BODY_BYTES: ${ABCM_REST_MAX_REQUEST_BODY_BYTES:-1048576}
      ABCM_REST_REQUEST_TIMEOUT_MS: ${ABCM_REST_REQUEST_TIMEOUT_MS:-30000}
      ABCM_REST_MAX_REQUESTS_PER_MINUTE: ${ABCM_REST_MAX_REQUESTS_PER_MINUTE:-600}
      ABCM_MCP_ENABLED: "false"
      ABCM_MCP_PATH: /mcp
      ABCM_MCP_ALLOWED_HOSTNAMES: ${ABCM_MCP_ALLOWED_HOSTNAMES:-localhost,127.0.0.1,[::1]}
      ABCM_MCP_ALLOWED_ORIGINS: ${ABCM_MCP_ALLOWED_ORIGINS:-localhost,127.0.0.1,[::1]}
    volumes:
      - type: bind
        source: ${ABCM_WORKSPACE_PATH:?required}
        target: /workspace
        read_only: true
      - type: volume
        source: managed-workspaces
        target: /workspaces
    init: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    healthcheck:
      test:
        - CMD
        - bun
        - -e
        - const response = await fetch('http://127.0.0.1:8787/health'); if (!response.ok) process.exit(1);
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

volumes:
  managed-workspaces:
