        testCase: отличает cold, warm и stale, не смешивая principal, access, MapRevision и policy
      - file: test/context-efficiency-benchmark-contract.test.ts
        testCase: фиксирует manifest для 16-scenario V0-V5 business receipt и приоритетные gates
  - scenarioId: BIZ-CTX-010
    fixtureId: stale-bootstrap
    evidence:
      - file: test/domain-language-bootstrap.test.ts
        testCase: expires bootstraps and invalidates them when the active map revision changes
      - file: test/context-builder.test.ts
        testCase: rejects unresolved explicit documents and stale materialized bytes
  - scenarioId: BIZ-CTX-011
    fixtureId: cross-scope-access
    evidence:
