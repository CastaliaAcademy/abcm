schemaVersion: abcm.benchmark.adversarial-coverage/v1
datasetId: context-retrieval-business-scenarios-v1
fixtureCatalogId: context-retrieval-business-fixtures-v1
scope: local-synthetic-and-adversarial
excludedExternalScenarioIds:
  - BIZ-CTX-001
