cases:
  - scenarioId: BIZ-CTX-003
    fixtureId: oversized-required-document
    evidence:
      - file: test/context-document-projection.test.ts
        testCase: summary и metadata оцениваются по проекции, сохраняя checksum исходника
      - file: test/context-builder.test.ts
        testCase: reserves mandatory content before optional budget and reports boundaries
  - scenarioId: BIZ-CTX-004
    fixtureId: multi-explicit-links
    evidence:
      - file: test/context-explicit-document-links.test.ts
        testCase: document id, URI и repository file используют один MapRevision index
  - scenarioId: BIZ-CTX-005
    fixtureId: repository-path-exact
    evidence:
      - file: test/context-explicit-document-links.test.ts
        testCase: document id, URI и repository file используют один MapRevision index
      - file: test/context-relevance-ranking.test.ts
        testCase: обязательные и exact-scope документы не вытесняются ancestor template/index шумом
  - scenarioId: BIZ-CTX-006
    fixtureId: canonical-language-variants
    evidence:
      - file: test/scope-path-resolver.test.ts
        testCase: normalizes aliases after the first target and performs one bounded re-resolution
      - file: test/scope-path-resolver.test.ts
        testCase: fails closed for unknown language, ambiguous targets and inaccessible candidates
  - scenarioId: BIZ-CTX-007
    fixtureId: template-and-index-noise
    evidence:
