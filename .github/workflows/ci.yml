name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run build
      - run: bun run sbom:generate
      - run: git diff --exit-code docs/release/sbom.cdx.json
      - run: bun run release:check
      - run: bun pm pack --dry-run
      - run: bun audit --audit-level=high
