# 0. Метаданные и границы документа (SpecificationPreamble)
apiVersion: abcm.dev/spec/v1alpha1

kind: FileWorkspaceMvpSpecification

metadata:
  name: abcm-file-workspace-mvp
  title: ABCM MVP - file structure, file and scope semantics, ScopeMap, and ContextBundle
  version: 0.5.0
  status: draft
  language: ru
  publishedAt: '2026-07-26'
  productName: ABCM
  productExpansion: Agent Build Context Manager
  humanDocument: ABCM_MVP_Human_Guide_v0.5.pdf
  changes:
    - Reinterpreted global, scope, by-link, by-description and manual as skill connection strategies rather than 
      document-selection strategies.
    - Added metadata.abcm-skill-strategy and deprecated metadata.abcm-context-strategy for skill activation.
    - Added concrete connection examples for all five skill strategies and a deterministic SkillConnectionResolution 
      algorithm.
    - Added ConnectedSkillRecord, SkillConnectionReason and SkillContextRequirement to ContextBundle and 
      ContextFingerprint.
    - Removed the skill-level ContextBasePolicy concept; document selection remains a responsibility of 
      buildTaskContext.
    - Preserved source-code classification and one-way documentation synchronization rules from v0.4.
normativeLanguage:
  keywords:
    MUST: mandatory requirement
    MUST_NOT: prohibited behavior
    SHOULD: recommended unless a documented reason exists
    MAY: optional capability
  terminologyNotation: русский термин (EnglishInvariant)

sourceReferences:
  - id: agent-skills
    title: Agent Skills Specification
    url: https://agentskills.io/specification
    usedFor:
      - SKILL.md frontmatter
      - skill directory layout
      - metadata extension point
      - progressive disclosure
  - id: mcp-tools
    title: Model Context Protocol 2025-11-25 - Tools
    url: https://modelcontextprotocol.io/specification/2025-11-25/server/tools
    usedFor:
      - agent-facing operations
      - structured input and output schemas
  - id: mcp-resources
    title: Model Context Protocol 2025-11-25 - Resources
    url: https://modelcontextprotocol.io/specification/2025-11-25/server/resources
    usedFor:
      - URI-addressed map and document resources
  - id: sqlite-network
    title: SQLite Over a Network - Caveats and Considerations
    url: https://sqlite.org/useovernet.html
    usedFor:
      - single-owner database constraint
      - network filesystem warning
  - id: sqlite-wal
    title: SQLite Write-Ahead Logging
    url: https://www.sqlite.org/wal.html
    usedFor:
      - prohibition of WAL on network filesystems

productBoundary:
  purpose: ABCM scans a human-editable workspace, builds a validated scope map, resolves domain terminology, and 
    produces bounded reproducible context bundles for software agents.
  mvpInterfaces:
    - REST
    - MCP
    - filesystem synchronization
    - Agent Skills compatible folders
  owns:
    - scope discovery and validation
    - file metadata extraction
    - current scope map
    - domain language bootstrap
    - dynamic task context resolution
    - context fingerprints
    - role and skill discovery
    - skill discovery and deterministic skill connection
    - artifact indexing
    - documentation source discovery and one-way synchronization
    - documentation import preview and managed-storage cutover
    - optional source-path locator index
  doesNotOwn:
    - LLM runtime
    - source code execution
    - VCS hosting
    - CI runtime
    - hard security enforcement outside ABCM
    - full document versioning
    - multi-writer distributed database coordination

specificationFlow:
  - order: 1
    title: устройство файловой структуры
    englishInvariant: FileStructure
    purpose: Define the physical workspace tree, canonical source, hidden service state, and safe file-writing rules.
    includes:
      - workspaceModel
      - reservedDirectoryNames
      - filesystemLayout
      - systemDatabase
      - fileWriting
      - fileDiscoveryPolicy
      - documentationSources
  - order: 2
    title: назначение разделов, спецификация файлов и областей
    englishInvariant: FileAndScopeSpecification
    purpose: Define what every directory and file means before any derived project map is built.
    includes:
      - scopeManifest
      - configuration
      - metadataModel
      - artifactNaming
      - artifactModel
      - architectureModel
      - planLayout
      - agentRoles
      - agentSkills
      - skillConnectionModel
      - uriScheme
      - contextReadiness
      - DomainLanguageConvention
      - fileClassification
      - documentationSynchronization
  - order: 3
    title: построение и представление карты проекта
    englishInvariant: ScopeMapConstructionAndProjection
    purpose: Convert the file workspace into an immutable map revision and expose filtered map projections.
    includes:
      - scopeDiscovery
      - scopeMapModel
      - methods.getScopeMap
      - algorithms.scanWorkspace
      - algorithms.buildScopeMap
      - algorithms.reconcileScopeMap
      - algorithms.getScopeMapProjection
      - mapResponseExample
      - conceptualDiagrams.scopeMapConstructionMermaid
      - algorithms.synchronizeDocumentationSource
      - algorithms.cutoverDocumentationSource
  - order: 4
    title: построение и представление пакета контекста
    englishInvariant: ContextBundleConstructionAndRepresentation
    purpose: Resolve the task path from domain language and construct a bounded, reproducible ContextBundle.
    includes:
      - contextSelection
      - contextFingerprint
      - dynamicContextModel
      - methods.getDomainLanguage
      - methods.buildTaskContext
      - algorithms.getDomainLanguage
      - algorithms.buildTaskContext
      - algorithms.resolveSkillConnections
      - algorithms.buildAgentMapView
      - buildTaskContextRequestExample
      - contextBundleExample
      - conceptualDiagrams.dynamicContextMermaid
      - dynamicContextExamples

# 1. Устройство файловой структуры (FileStructure)
      - skillConnectionExamples
workspaceModel:
  invariant: one_directory_equals_one_workspace_and_one_root_workflow
  canonicalSource: filesystem_by_document_storage_mode
  derivedState: .abcm/abcm.sqlite
  rootScopeKind: workflow
  hierarchy:
    - kind: workflow
      rank: 0
      allowedParent:
      allowedChild: project
    - kind: project
      rank: 1
      allowedParent: workflow
      allowedChild: service
    - kind: service
      rank: 2
      allowedParent: project
      allowedChild: feature
    - kind: feature
      rank: 3
      allowedParent: service
      allowedChild:
  hierarchyRule: child.rank == parent.rank + 1
  nestedWorkflowSupported: false
  parentResolution: physical_directory_parent
  parentFieldInManifest: forbidden

  canonicalSourcePolicy:
    managed: The copy inside the ABCM workspace is canonical.
    mirror: The configured external documentation source is canonical; the ABCM copy is a synchronized materialization.
reservedDirectoryNames:
  - .abcm
  - config
  - domain-language
  - agents
  - artifacts
  - architecture

filesystemLayout:
  completeExample: "root/                                  # workflow scope\n├── .abcm/\n│   └── abcm.sqlite\n├── scope.yaml\n\
    ├── README.md\n├── config/\n├── domain-language/\n├── agents/\n├── artifacts/\n├── architecture/\n├── project-1/     \
    \                   # project scope\n│   ├── scope.yaml\n│   ├── README.md\n│   ├── config/\n│   ├── domain-language/\n\
    │   ├── agents/\n│   ├── artifacts/\n│   ├── architecture/\n│   ├── s1/                           # service scope\n│ \
    \  │   ├── scope.yaml\n│   │   ├── README.md\n│   │   ├── config/\n│   │   ├── domain-language/\n│   │   ├── agents/\n\
    │   │   ├── artifacts/\n│   │   ├── architecture/\n│   │   ├── feature-a/                # feature scope\n│   │   │  \
    \ ├── scope.yaml\n│   │   │   ├── README.md\n│   │   │   ├── config/\n│   │   │   ├── domain-language/\n│   │   │   ├──
    agents/\n│   │   │   ├── artifacts/\n│   │   │   └── architecture/\n│   │   └── feature-b/\n│   │       └── ...\n│   ├──
    s2/\n│   │   └── ...\n│   └── s3/\n│       └── ...\n└── project-2/\n    └── ..."
  scopeContent: "<scope>/\n├── scope.yaml\n├── README.md\n├── config/\n│   ├── context.yaml\n│   ├── agents.yaml\n│   ├──
    decisions.yaml\n│   ├── quality.yaml\n│   ├── access.yaml\n│   ├── sync.yaml\n│   └── relations.yaml\n├── domain-language/\n\
    │   ├── DomainLanguageConvention.md\n│   ├── glossary.yaml\n│   ├── domains.yaml\n│   ├── entities.yaml\n│   ├── aliases.yaml\n\
    │   └── naming.yaml\n├── agents/\n│   ├── roles/\n│   │   ├── README.md\n│   │   └── <role-id>.md\n│   └── skills/\n│\
    \       └── <skill-name>/\n│           ├── SKILL.md\n│           ├── scripts/\n│           ├── references/\n│        \
    \   └── assets/\n├── artifacts/\n│   ├── adr/\n│   ├── rfc/\n│   ├── technical-debt/\n│   ├── conventions/\n│   │   ├──
    style/\n│   │   ├── technology/\n│   │   ├── api/\n│   │   ├── security/\n│   │   └── domain/\n│   ├── templates/\n│ \
    \  │   ├── assignments/\n│   │   ├── reports/\n│   │   ├── specifications/\n│   │   ├── plans/\n│   │   ├── roadmaps/\n\
    │   │   └── evals/\n│   ├── plans/\n│   │   └── <plan-id>/\n│   │       ├── plan.md\n│   │       ├── assignments/\n│ \
    \  │       ├── specifications/\n│   │       ├── roadmaps/\n│   │       ├── tdd/\n│   │       ├── current-state/\n│   │\
    \       ├── reports/\n│   │       ├── context-fingerprints/\n│   │       └── evidence/\n│   ├── reports/\n│   │   ├──
    periodic/\n│   │   ├── completed-work/\n│   │   ├── architecture/\n│   │   ├── security/\n│   │   ├── statistics/\n│ \
    \  │   └── sync-gate/\n│   └── evals/\n│       ├── capability/\n│       ├── regression/\n│       ├── session-length/\n\
    │       ├── escalation/\n│       ├── security/\n│       ├── performance/\n│       ├── datasets/\n│       └── fixtures/\n\
    └── architecture/\n    ├── README.md\n    ├── documents/\n    ├── plantuml/\n    │   ├── c4/\n    │   ├── components/\n\
    \    │   ├── sequences/\n    │   ├── deployments/\n    │   └── data-flows/\n    └── rendered/\n        ├── svg/\n    \
    \    └── png/"

systemDatabase:
  path: .abcm/abcm.sqlite
  visibility: hidden_service_state
  canonical: false
  rebuildableFromFilesystem: true
  allowedContents:
    - scope nodes and edges
    - invalid branch diagnostics
    - file index
    - parsed frontmatter
    - checksums
    - abcm URI index
    - relations
    - DomainLanguageConvention readiness
    - scan history
    - context build cache
    - runtime locks
    - lease and fencing tokens
    - active run metadata
    - tombstones
  prohibitedAsOnlyCopy:
    - scope manifests
    - configuration
    - ADR and RFC text
    - technical debt documents
    - plans and reports
    - skills and roles
    - architecture sources
    - evidence files
  networkFilesystemConstraints:
    singleOwnerProcess: MUST
    directClientDatabaseAccess: MUST_NOT
    walMode: MUST_NOT
    recommendedJournalMode: rollback
    simultaneousMultiHostWriters: unsupported
    failureMode: use_local_database_or_client_server_database

fileWriting:
  strategy:
    - create temporary file in target directory
    - flush and optionally fsync
    - atomic rename over target
    - rescan changed path
    - commit derived database update
  absoluteNetworkPathsInDocuments: forbidden
  symbolicLinks: discouraged
  portableLinks: abcm_uri

# 2. Назначение разделов, спецификация файлов и областей (FileAndScopeSpecification)
fileDiscoveryPolicy:
  scopeMapIsSourceTree: false
  scopeMapProjectionContainsIndividualSourceFiles: false
  defaultManagedRoots:
    - scope.yaml
    - README.md
    - config/**
    - domain-language/**
    - agents/**
    - artifacts/**
    - architecture/**
  defaultIgnoredDirectories:
    - .git
    - .svn
    - node_modules
    - vendor
    - dist
    - build
    - out
    - coverage
    - .cache
    - .next
    - .turbo
    - tmp
  defaultIgnoredFilePatterns:
    - '**/*.min.js'
    - '**/*.map'
    - '**/*.lock'
    - '**/*.log'
    - '**/*.tmp'
    - '**/.DS_Store'
    - '**/Thumbs.db'
  classifications:
    scope_manifest: scope.yaml; parsed into ScopeManifest and ScopeNode.
    configuration: Files under config/; parsed as ABCM configuration.
    domain_language: DomainLanguageConvention and structured domain-language files.
    agent_definition: Role markdown and SKILL.md.
    context_document: ADR, RFC, debt, conventions, plans, reports, eval definitions, and architecture sources.
    executable_resource: Scripts under skill/eval/statistics executable zones; indexed as metadata, never as a normal 
      document body by default.
    source_locator: Optional metadata-only record for project source files when source indexing is enabled.
    generated_resource: Rendered diagrams, build output, generated reports or caches; excluded from ordinary context 
      selection.
    ignored: File not indexed for context or map purposes.
  executableFiles:
    ordinaryProjectCodeDefault: ignored_by_document_index
    skillScripts: ExecutableResourceRecord
    evalAndStatisticsScripts: ExecutableResourceRecord
    visibleInScopeMapProjection: false
    visibleInAdminDiagnostics: aggregate counts and explicit resource metadata only
    includedInContextBundleByDefault: false
    activationRequired: true
    bodyMayBeIncludedOnlyWhen:
      - an explicit code-reference policy permits it
      - the caller has executable_resource.read
      - the request or selected skill explicitly references the resource
  sourceLocatorIndex:
    enabledByDefault: false
    purpose: Resolve repository paths, components and owning scopes without treating the complete codebase as context.
    recordsBodies: false
    fields:
      - relativePath
      - extension
      - owningScopeId
      - componentTags
      - size
      - mtime
      - optionalChecksum
    contentRetrieval: delegated_to_vcs_or_workspace_tool_after_ContextBundle_selection
  explicitCodeReference:
    configurationPath: config/context.yaml
    recordType: CodeReferenceRecord
    defaultProjection: reference
    example:
      include:
        - src/domain/token-rotation.ts
      kind: code-reference
      contextPolicy: explicit-only
documentationSources:
  configurationFile: config/sync.yaml
  principle: One document has exactly one canonical location at a time; two-way synchronization is not supported.
  connectorRootStorage: Connector ids are stored in config/sync.yaml; physical roots and credentials live in service 
    deployment configuration or protected connector records.
  storageModes:
    managed:
      canonicalLocation: ABCM workspace
      writes: REST, MCP, UI, or direct authorized file edit
      externalDeletionAffectsABCM: false
    mirror:
      canonicalLocation: external repository or documentation directory
      direction: external_to_ABCM_only
      ABCMCopyWritable: false
      onCreate: copy_to_mapped_scope_path_then_reconcile
      onModify: atomic_replace_mirror_then_reconcile
      onMove: preserve document identity when provenance or checksum permits; otherwise delete+create
      onDelete: remove active ABCM mirror and persist a tombstone in .abcm/abcm.sqlite
      projectFilesModifiedByABCM: false
  automaticDiscovery:
    precondition: A DocumentationSource and mapping rules have been approved.
    behavior: New matching files are copied and synchronized without modifying the source project.
    initialImportRequiresPreview: true
  mappingExample:
    apiVersion: abcm/v1
    kind: DocumentationSyncConfig
    sources:
      - id: project-repository-docs
        connector: repository-main
        mode: mirror
        include:
          - README.md
          - docs/**
          - '**/ADR-*.md'
          - '**/RFC-*.md'
        exclude:
          - .git/**
          - node_modules/**
          - dist/**
          - build/**
        mapping:
          - match: docs/adr/**
            target: artifacts/adr/
            scope: project
          - match: docs/rfc/**
            target: artifacts/rfc/
            scope: project
          - match: docs/architecture/**
            target: architecture/documents/
            scope: project
          - match: README.md
            target: README.md
            scope: project
  collisionRules:
    managedTargetExists: SOURCE_TARGET_CONFLICT
    multipleSourcesMapToSameTarget: DOCUMENTATION_MAPPING_AMBIGUOUS
    documentIdConflict: DOCUMENT_ID_DUPLICATE
    overwriteManagedDocumentAutomatically: false
  protectedDeletion:
    defaultBehavior: remove_active_mirror_and_tombstone
    acceptedAdrOrRfc: also emit PROTECTED_MIRROR_DOCUMENT_DELETED with high severity
  cutoverToManaged:
    operatorControlled: true
    purpose: Move canonical ownership from repository documentation to the separate ABCM workspace.
    steps:
      - freeze or coordinate edits in the source documentation set
      - perform a final one-way synchronization
      - verify source and mirror checksums
      - publish a cutover plan and resolve collisions
      - mark the ABCM copies managed in one atomic operation
      - disable deletion propagation from the former source
      - optionally leave repository pointer files; ABCM never writes or deletes them automatically
scopeManifest:
  file: scope.yaml
  contentType: application/yaml
  requiredFields:
    - apiVersion
    - kind
    - id
    - name
  optionalFields:
    - aliases
    - status
    - owner
    - tags
    - description
  constraints:
    apiVersion: abcm/v1
    kindEnum:
      - workflow
      - project
      - service
      - feature
    idPattern: ^[a-z0-9][a-z0-9-]{0,62}[a-z0-9]$|^[a-z0-9]$
    nameMaxLength: 160
    parentFieldAllowed: false
    directoryNameShouldMatchId: true
  example: "apiVersion: abcm/v1\nkind: service\nid: checkout\nname: Checkout\naliases:\n  - checkout-service\nstatus: active\n\
    owner:\n  type: team\n  id: checkout-team\ntags:\n  - payments\n  - backend"

configuration:
  directory: config
  files:
    context.yaml:
      purpose: context budgets, required document rules, exclusions and override behavior
    agents.yaml:
      purpose: available agent roles, delegation limits and role defaults
    decisions.yaml:
      purpose: configurable agent/operator decision boundaries
    quality.yaml:
      purpose: quality score threshold, category floors and hard gates
    access.yaml:
      purpose: MVP access profiles and scope bindings
    sync.yaml:
      purpose: scan schedule, file patterns and synchronization behavior
    relations.yaml:
      purpose: explicit cross-scope and artifact relations
  inheritanceOrder:
    - workflow
    - project
    - service
    - feature
  mergeRules:
    scalar: nearest_scope_wins
    map: deep_merge
    list: replace_by_default
    keyedList: merge_by_id_if_schema_marks_key
    lockedRule: descendants_cannot_weaken
  configResolutionMustBeRecordedInContextFingerprint: true

metadataModel:
  genericFrontmatter:
    required:
      - id
      - kind
      - title
    optional:
      - status
      - domain
      - owner
      - worker
      - required
      - requiredFor
      - audiences
      - tags
      - links
      - overrides
      - controlMode
      - createdAt
      - updatedAt
    fieldSemantics:
      id: stable artifact identity independent of filename
      kind: artifact type
      domain: canonical domain id from DomainLanguageConvention
      owner: durable owner such as team or role
      worker: temporary atomic routing hint for executor ownership
      required: include whenever applicable even if role schema omits it
      requiredFor: role and task-type conditional requirement
      audiences: intended agent roles
      links: explicit abcm URI relations
      overrides: ids of documents explicitly overridden
      controlMode: context or operator
  example: "---\nid: ADR-0001\nkind: adr\ntitle: Refresh token storage\nstatus: accepted\ndomain: identity\nowner:\n  type:
    team\n  id: identity-platform\nrequired: true\naudiences:\n  - architecture_designer_agent\n  - executor_agent\nlinks:\n\
    \  - abcm://architecture/authentication-boundaries\n---"

artifactNaming:
  canonicalPattern: <TYPE>-<number>--<slug>.<ext>
  optionalRoutingPrefixes:
    - domain-<domain-id>__
    - worker-<worker-id>__
  prefixOrder:
    - domain
    - worker
  identitySource: frontmatter.id
  filenameIsIdentity: false
  examples:
    - ADR-0001--refresh-token-storage.md
    - domain-identity__ADR-0002--token-family.md
    - worker-auth__ADR-0003--rotation-cache.md
    - domain-identity__worker-auth__ADR-0004--token-reuse.md
    - RFC-0001--error-contract.md
    - DEBT-0001--duplicate-validation.md
  workerRequired: false
  domainRequired: false
  workerPrefixSemantics: temporary_mvp_routing_hint

artifactModel:
  artifactsDirectory: artifacts
  types:
    adr:
      directory: adr
      immutableAfterAccepted: true
    rfc:
      directory: rfc
      immutableAfterAccepted: true
    technicalDebt:
      directory: technical-debt
      mutableStatus: true
    conventions:
      directory: conventions
      subtypes:
        - style
        - technology
        - api
        - security
        - domain
    templates:
      directory: templates
    plans:
      directory: plans
    reports:
      directory: reports
    evals:
      directory: evals
  architectureExcludedFromArtifacts: true

architectureModel:
  directory: architecture
  purpose: high abstraction documents and diagram sources
  allowed:
    - overview documents
    - system boundaries
    - integration maps
    - PlantUML sources
    - rendered SVG and PNG
  prohibited:
    - ADR storage
    - RFC storage
    - plan state
  defaultContextScan:
    documents: include_by_role_or_relevance
    plantumlSources: include_by_role_or_relevance
    rendered: exclude

planLayout:
  directoryPattern: artifacts/plans/<plan-id>
  filesAndDirectories:
    plan.md: canonical human-readable plan
    assignments: immutable dispatched agent assignments
    specifications: requirements and technical specifications
    roadmaps: roadmap documents
    tdd: TDD plans and approvals
    current-state: materialized state plus append-only events
    reports: orchestrator, workers, quality-gate and sync-gate reports
    context-fingerprints: execution and subagent fingerprints
    evidence: tests, eval runs, analyzers, diffs and attachments
  planStateSourceOfTruth: current-state/events
  progressYamlAuthoritative: false
  planStateWriters:
    - orchestrator_agent
    - architecture_designer_agent

agentRoles:
  directory: agents/roles
  format: markdown_with_yaml_frontmatter
  recommendedFields:
    - apiVersion
    - kind
    - id
    - displayName
    - description
    - responsibilities
    - context.links
    - context.requiredArtifactKinds
    - context.requiredTags
    - delegation
    - reportTemplate
  roleLinkSources:
    - frontmatter.context.links
    - explicit abcm URIs in role description
    - assignment contextLinks
  example: "---\napiVersion: abcm/v1\nkind: AgentRole\nid: executor-agent\ndisplayName: Executor agent\ndescription: >-\n\
    \  Implements one approved work unit. Use the identity domain context at\n  abcm://scope/identity-service and the accepted
    token decision at\n  abcm://artifact/ADR-0001 when they are applicable.\ncontext:\n  links:\n    - abcm://scope/identity-service\n\
    \  requiredArtifactKinds:\n    - conventions\n    - adr\n    - eval\ndelegation:\n  maySpawn: []\nreportTemplate: abcm://artifact/executor-report-template\n\
    ---"

agentSkills:
  directory: agents/skills/<skill-name>
  standard: Agent Skills
  requiredFile: SKILL.md
  optionalDirectories:
    - scripts
    - references
    - assets
  skillNameMustMatchDirectory: true
  abcmExtension:
    connectionStrategy:
      fieldPath: metadata.abcm-skill-strategy
      valueType: string
      enum:
        - global
        - scope
        - by-link
        - by-description
        - manual
      default: by-description
    legacyContextStrategy:
      fieldPath: metadata.abcm-context-strategy
      acceptedUntil: '1.0'
      mapsValuesWithoutSemanticChange: true
      warning: SKILL_CONTEXT_STRATEGY_DEPRECATED
    removedBasePolicy:
      fieldPath: metadata.abcm-context-base
      acceptedUntil: '1.0'
      behavior: ignored
      warning: SKILL_CONTEXT_BASE_REMOVED
  metadataValuesMustBeStrings: true
  example: "---\nname: prisma-major-upgrade\ndescription: >-\n  Upgrade Prisma across schema, generated client and runtime
    integration.\n  Use for major-version migrations that require compatibility checks and staged validation.\ncompatibility:
    ABCM MVP; Agent Skills compatible\nmetadata:\n  abcm-skill-strategy: by-description\n  abcm-task-types: \"dependency-upgrade,database-migration\"\
    \n  abcm-roles: \"executor-agent,quality-gate-agent\"\n  abcm-domains: \"data-access\"\n  abcm-version: \"0.5\"\n---\n\
    \n# Goal\n\nPerform a controlled Prisma major-version migration.\n\n# Process\n\n1. Read the approved assignment and connected
    ContextBundle.\n2. Inspect schema, generated client and runtime adapters.\n3. Follow the migration plan and required tests.\n\
    4. Report compatibility findings and evidence.\n"
  progressiveDisclosure:
    catalogIndex: ABCM indexes name, description, compatibility and metadata for discoverable skills.
    connection: The full SKILL.md body is materialized only after the skill is connected.
    resources: scripts, references and assets are not inserted automatically; they remain addressable resources.
    executableScripts: Scripts are ExecutableResourceRecord entries and require separate activation and permission 
      checks.
  connectionStrategySemantics:
    global:
      when: The skill is a small workspace-wide baseline that every eligible task or agent session must use.
      ownerScope: workflow
      trigger: Every build in the workspace after compatibility, lifecycle, access and role/task filters pass.
      connection: Attach one ConnectedSkillRecord and materialize SKILL.md without semantic search.
      example: workspace-quality-baseline for common reporting, evidence and safety conventions.
      warning: Global does not mean load all workflow documents; it only controls skill connection.
    scope:
      when: The skill applies to one scope and all valid descendants of the scope that owns the skill.
      trigger: PrimaryTargetScope or an explicitly affected scope is the owner scope or its descendant.
      connection: Resolve the closest applicable skill version by local-to-public precedence and attach it.
      example: payments-event-contract stored at project payments and used by its services and features.
    by-link:
      when: A role, assignment, plan or explicit request names the exact skill with an abcm://skill URI.
      trigger: A readable explicit link is present in role description/frontmatter, assignment contextLinks, plan links 
        or request.
      connection: Resolve the stable id and requested version/digest; missing required links fail the build.
      example: quality-gate-agent links abcm://skill/security-review for security-sensitive review tasks.
    by-description:
      when: The skill should be discovered from its human-readable description and compact routing metadata.
      trigger: Name, description, task types, roles, domains and tags match NormalizedTaskIntent above the configured 
        threshold.
      connection: Rank compact SkillDescriptor records server-side, connect unambiguous matches, and record score and 
        evidence.
      example: prisma-major-upgrade matches a task whose goal is to migrate Prisma to a new major version.
    manual:
      when: The skill is experimental, high-risk, rare or must be selected by an operator/orchestrator.
      trigger: The caller supplies requestedSkillIds or a decision record explicitly approves the skill.
      connection: No implicit scope, link or description matching is performed for that skill.
      example: experimental-event-store-rewrite is attached only to one approved migration run.
  connectionPrecedence:
    - explicit deny or incompatibility
    - manual request and exact by-link reference
    - scope and global automatic eligibility
    - by-description score
    - 'local-to-public version precedence: feature, service, project, workflow unless a locked version is declared'
  mandatoryContentRule: A connected skill may add SkillContextRequirement records but MUST NOT suppress required, 
    operator-controlled, role-required or task-required documents.
  resultRecord: ConnectedSkillRecord
  connectionReasons:
    - global_workspace_baseline
    - scope_owner_or_descendant
    - explicit_skill_link
    - description_match
    - manual_request
skillConnectionModel:
  purpose: Determine in which situation and by which evidence a skill is connected to one agent task or session.
  notResponsibleFor:
    - choosing the complete document context
    - loading every file from the skill owner scope
    - granting script execution permission
    - overriding mandatory context or access policy
  inputs:
    - MapRevision
    - ResolvedScopePath
    - AffectedScopes
    - NormalizedTaskIntent
    - RoleProfile
    - TaskTypeProfile
    - explicit abcm://skill links
    - requestedSkillIds
    - principal permissions
  outputs:
    - ConnectedSkillRecord[]
    - SkillContextRequirement[]
    - SkillConnectionDiagnostic[]
  connectedSkillRecord:
    requiredFields:
      - skillId
      - skillDigest
      - sourceScopeId
      - strategy
      - connectionReasons
      - descriptor
      - bodyProjection
      - lifecycle
      - compatibility
    optionalFields:
      - matchScore
      - matchedTerms
      - requiredContextLinks
      - resourceReferences
      - activationDecisionId
  deduplication: One skill id/version is materialized once; all independent connection reasons are retained.
  bodyProjection:
    - descriptor
    - full-skill
  defaultBodyProjection: full-skill after connection; descriptor only before connection
skillConnectionExamples:
  - id: SKILL-EX-GLOBAL
    strategy: global
    situation: Every development and review task must follow one compact workspace reporting and evidence protocol.
    placement: root/agents/skills/workspace-quality-baseline/SKILL.md
    metadata:
      abcm-skill-strategy: global
      abcm-roles: executor-agent,quality-gate-agent
    resolution:
      - buildTaskContext pins the workspace MapRevision.
      - The resolver finds the workflow-owned global skill.
      - Compatibility and access pass, so it is connected without semantic search.
      - The ContextBundle records reason=global_workspace_baseline.
  - id: SKILL-EX-SCOPE
    strategy: scope
    situation: All services and features inside the payments project use the same event-contract procedure.
    placement: root/payments/agents/skills/payments-event-contract/SKILL.md
    metadata:
      abcm-skill-strategy: scope
    resolution:
      - The task path resolves to payments/checkout/refund.
      - The skill owner project payments is an ancestor of the target feature.
      - The skill is connected; a task in another project does not receive it.
  - id: SKILL-EX-BY-LINK
    strategy: by-link
    situation: The quality-gate role must use a specific security review protocol for one class of tasks.
    placement: root/agents/skills/security-review/SKILL.md
    roleLink: abcm://skill/security-review
    metadata:
      abcm-skill-strategy: by-link
    resolution:
      - Role or assignment contains the exact skill URI.
      - buildTaskContext resolves the stable skill id and digest.
      - The skill is connected with reason=explicit_skill_link; a missing required URI fails the build.
  - id: SKILL-EX-BY-DESCRIPTION
    strategy: by-description
    situation: The task says “upgrade Prisma to a new major version” without naming a skill.
    placement: root/project/agents/skills/prisma-major-upgrade/SKILL.md
    metadata:
      abcm-skill-strategy: by-description
      abcm-task-types: dependency-upgrade,database-migration
      abcm-domains: data-access
    resolution:
      - Domain language normalizes Prisma and data-access terms.
      - The resolver scores compact skill descriptors without loading all SKILL.md bodies.
      - The match exceeds the threshold and is sufficiently separated from the second candidate.
      - The skill is connected with score/evidence in ConnectedSkillRecord.
  - id: SKILL-EX-MANUAL
    strategy: manual
    situation: An experimental event-store rewrite must not be selected automatically.
    placement: root/project/service/agents/skills/experimental-event-store-rewrite/SKILL.md
    metadata:
      abcm-skill-strategy: manual
    request:
      requestedSkillIds:
        - experimental-event-store-rewrite
    resolution:
      - No scope, link or description rule connects the skill.
      - The operator/orchestrator explicitly requests it for the approved run.
      - The skill is connected with reason=manual_request and the decision id is recorded.
uriScheme:
  scheme: abcm
  forms:
    scope: abcm://scope/<scope-id>
    artifact: abcm://artifact/<artifact-id>
    plan: abcm://plan/<plan-id>
    architecture: abcm://architecture/<document-id>
    role: abcm://role/<role-id>
    skill: abcm://skill/<skill-name>
  resolution:
    byStableId: true
    byPhysicalPath: false
  unresolvedLinkBehavior: warning_for_map_error_for_required_context

contextReadiness:
  requiredDocuments:
    workflow:
      - domain-language/DomainLanguageConvention.md
    project:
      - domain-language/DomainLanguageConvention.md
    service:
      - domain-language/DomainLanguageConvention.md
    feature:
      - domain-language/DomainLanguageConvention.md
  inheritOnlyAllowed: true
  inheritOnlyExample: '---

    apiVersion: abcm/v1

    kind: DomainLanguageConvention

    mode: inherit-only

    ---'
  mapBehaviorOnMissingConvention: return_map_with_warning
  buildTaskContextBehaviorOnMissingConvention: fail

DomainLanguageConvention:
  directory: domain-language
  humanEntryPoint: DomainLanguageConvention.md
  structuredFiles:
    glossary.yaml: canonical concepts and definitions
    domains.yaml: domain identifiers and boundaries
    entities.yaml: entities, events, commands and value objects
    aliases.yaml: aliases, deprecated names and homonyms
    naming.yaml: service, API, code and artifact naming rules
  mergeOrder:
    - workflow
    - project
    - service
    - feature
  pathResolutionTiming: after_effective_domain_language_is_built
  unknownDomainBehavior: error
  unknownTermBehavior: error
  unknownKeywordBehavior: allow
  ambiguousTermBehavior: error_or_decision_policy

# 3. Построение и представление карты проекта (ScopeMapConstructionAndProjection)
scopeDiscovery:
  markerFile: scope.yaml
  rule: a_directory_is_a_scope_only_if_scope_yaml_exists
  ordinaryFoldersWithoutMarkerAreScopes: false
  rootValidationError: WORKSPACE_ROOT_MUST_BE_WORKFLOW
  invalidBranchBehavior:
    persistNodeStatus: invalid
    includeInAdminMap: true
    includeInAgentMap: false
    includeInContextResolver: false
    continueScanningOtherBranches: true
  examples:
    valid:
      - root/project-1
      - root/project-1/s1
      - root/project-1/s1/feature-a
    invalid:
      - path: root/project-1/internal-workflow
        reason: declared workflow under project raises hierarchy level
      - path: root/s1
        reason: service skips required project level
      - path: root/project-1/project-2
        reason: repeated project level
      - path: root/project-1/s1/feature-a/service-x
        reason: feature is a leaf
  directChildRule: Only direct non-reserved child directories of a valid scope are inspected as child-scope candidates. 
    A directory without scope.yaml is ordinary content and its descendants are not treated as hidden scopes in MVP.
  incrementalRule: Filesystem notifications MAY trigger a targeted reconcile, but a periodic full reconcile scan remains
    mandatory.

scopeMapModel:
  canonicalSource: FileWorkspace
  derivedStore: .abcm/abcm.sqlite
  entities:
    ScanLease:
      - workspaceId
      - ownerId
      - expiresAt
      - fencingToken
    ScanSession:
      - scanId
      - workspaceId
      - startedAt
      - previousMapRevision
      - status
    ScopeNode:
      - scopeId
      - kind
      - name
      - aliases
      - relativePath
      - parentScopeId
      - rank
      - status
      - readiness
    ScopeRelation:
      - fromId
      - toId
      - relationType
      - source
      - status
    FileRecord:
      - scopeId
      - relativePath
      - size
      - mtime
      - checksum
      - parseStatus
      - classification
      - storageMode
      - sourceId
    DocumentRecord:
      - documentId
      - kind
      - scopeId
      - lifecycle
      - requiredSelectors
      - roleSelectors
      - taskSelectors
      - links
      - contextPolicy
    MapDiagnostic:
      - code
      - severity
      - scopeId
      - path
      - message
      - details
    MapRevision:
      - revision
      - digest
      - createdAt
      - scanId
      - nodes
      - relations
      - documents
      - readiness
      - diagnostics
    ScopeMapProjection:
      - revision
      - view
      - rootScopeId
      - depth
      - nodes
      - relations
      - warnings
      - resolverEntrypoints
    ExecutableResourceRecord:
      - resourceId
      - scopeId
      - relativePath
      - language
      - checksum
      - activationStatus
      - permissionsProfile
    SourceLocatorRecord:
      - scopeId
      - relativePath
      - extension
      - componentTags
      - size
      - mtime
      - optionalChecksum
    DocumentationSource:
      - sourceId
      - connectorId
      - storageMode
      - includeRules
      - excludeRules
      - mappingRules
      - status
    DocumentProvenance:
      - documentId
      - sourceId
      - sourcePath
      - sourceRevision
      - sourceChecksum
      - lastSynchronizedAt
    SyncRun:
      - syncRunId
      - sourceId
      - startedAt
      - finishedAt
      - created
      - updated
      - moved
      - deleted
      - conflicts
      - status
    Tombstone:
      - resourceId
      - sourceId
      - formerPath
      - checksum
      - deletedAt
      - reason
  invariants:
    - Exactly one MapRevision is active per workspace.
    - 'Publishing a MapRevision is atomic: readers observe either the previous complete revision or the new complete revision.'
    - InvalidBranch records may appear in AdminProjection but never in the active resolver graph.
    - ScopeMapProjection never contains document bodies.
    - A map rebuild is idempotent for an unchanged FileWorkspace.

    - ScopeMapProjection represents scopes and relations, not the complete project source tree.
    - Ordinary executable source files are not DocumentRecords unless explicitly configured as code references.
    - Mirrored documents retain source provenance and have exactly one external canonical location.
methods:
  getScopeMap:
    rest:
      method: GET
      path: /v1/workspaces/{workspaceId}/scope-map
    mcpResources:
      - abcm://map
      - abcm://map/<scope-id>
    query:
      viewEnum:
        - agent
        - admin
      optional:
        - rootScopeId
        - depth
        - includeInvalid
    outputAgentView:
      - mapRevision
      - visible nodes
      - id, kind, canonical name and relative path
      - direct child ids
      - relation summaries
      - readiness status
      - warnings relevant to accessible scopes
      - resolver entrypoints
      - resource summaries by class, without source-file enumeration
    outputAdminView:
      - all agent fields
      - invalid branches
      - diagnostics
      - indexed file counts
      - scan timestamps
      - convention readiness per scope
      - file classification counts and documentation synchronization status
    loadsDocumentBodies: false
    missingConventionHttpStatus: 200
    output: ScopeMapProjection
    purpose: Return a bounded, permission-filtered projection of one published MapRevision without loading document 
      bodies.
  getDomainLanguage:
    rest:
      method: POST
      path: /v1/context/domain-language
    mcpTool: context.get_domain_language
    purpose: build compact EffectiveDomainLanguage before task path resolution
    input:
      required:
        - anchor
      optional:
        - roleId
        - projection
      anchorAlternatives:
        - workspaceId plus projectId
        - workspaceId plus repository locator
        - agent session binding
    output:
      - bootstrapId
      - bootstrapDigest
      - anchor
      - source conventions and digests
      - compact EffectiveDomainLanguage
      - readiness status
    errors:
      - DOMAIN_LANGUAGE_CONFIGURATION_INVALID
      - PROJECT_ANCHOR_NOT_RESOLVED
      - ACCESS_DENIED
  buildTaskContext:
    rest:
      method: POST
      path: /v1/context/build-task-context
    mcpTool: context.build_task_context
    purpose: Resolve the execution path and bounded context without requiring the agent to read the full workspace map 
      or perform iterative searches.
    input:
      required:
        - domainLanguageBootstrapId
        - roleId
        - taskType
        - goal
      optional:
        - canonicalDomains
        - canonicalTerms
        - keywords
        - targetHints
        - explicitLinks
        - artifacts
        - budgetProfile
        - requestedSkillIds
        - explicitDocumentLinks
    output:
      - contextBundleId
      - bundleDigest
      - primaryTargetScope
      - affectedScopes
      - resolvedScopePath
      - skillConnectionReasons
      - connectedSkills
      - selectedDocuments
      - selectionReasons
      - warnings
      - conflicts
      - omissions
      - tokenEstimate
      - contextFingerprintLocation
    errors:
      - DOMAIN_LANGUAGE_BOOTSTRAP_REQUIRED
      - DOMAIN_LANGUAGE_BOOTSTRAP_STALE
      - CONTEXT_CONFIGURATION_INVALID
      - UNKNOWN_DOMAIN
      - UNKNOWN_DOMAIN_TERM
      - AMBIGUOUS_DOMAIN_TERM
      - TARGET_SCOPE_AMBIGUOUS
      - TARGET_SCOPE_INVALID
      - CONTEXT_CONFLICT_REQUIRES_OPERATOR
      - REQUIRED_CONTEXT_EXCEEDS_LIMIT
      - ACCESS_DENIED
      - SKILL_CONNECTION_AMBIGUOUS
      - REQUIRED_SKILL_LINK_UNRESOLVED
      - GLOBAL_SKILL_MUST_BE_WORKFLOW_OWNED
    outputEntity: ContextBundle
    supportingOutputs:
      - ResolvedScopePath
      - EffectiveDomainLanguage
      - ContextFingerprint
      - optional ResolverTrace
    mapPermissionNotRequired: scope_map.read_full
    pinsMapRevisionAtStart: true

  previewDocumentationImport:
    rest:
      method: POST
      path: /v1/workspaces/{workspaceId}/documentation-sources/preview
    mcpTool: documentation_source.preview
    purpose: Classify external documentation and produce a non-mutating mapping, collision and deletion preview.
    output:
      - DocumentationImportPlan
      - proposed mappings
      - conflicts
      - unclassified files
      - estimated changes
  applyDocumentationImport:
    rest:
      method: POST
      path: /v1/documentation-imports/{importId}/apply
    mcpTool: documentation_source.apply
    purpose: Create or update mirror copies after an approved preview.
    defaultStorageMode: mirror
  synchronizeDocumentationSource:
    rest:
      method: POST
      path: /v1/documentation-sources/{sourceId}/sync
    mcpTool: documentation_source.sync
    purpose: Run one-way source-to-ABCM reconciliation using configured mappings.
  cutoverDocumentationSource:
    rest:
      method: POST
      path: /v1/documentation-sources/{sourceId}/cutover
    mcpTool: documentation_source.cutover
    purpose: Atomically change mirrored documents to managed canonical documents after checksum validation.
    operatorControlled: true
algorithms:
  scanWorkspace:
    deprecatedAliasOf: buildScopeMap
  buildScopeMap:
    methodInvariant: buildScopeMap
    purposeRu: Построить и атомарно опубликовать новую карту областей (ScopeMap) из файлового рабочего пространства 
      (FileWorkspace).
    inputs:
      - workspaceRoot
      - scanConfiguration
      - previousActiveMapRevision?
    outputs:
      - MapRevision
      - MapDiagnostic[]
      - ScopeMapChanged event
    preconditions:
      - The caller is the single ABCM service owner for the workspace database.
      - The workspace root is readable.
    phases:
      - id: MAP-P0
        nameRu: Фиксация сканирования
        invariant: ScanPreparation
        steps:
          - id: MAP-001
            nameRu: Получить аренду сканирования
            invariant: AcquireScanLease
            action: Acquire ScanLease with TTL and fencing token.
            result: No second writer can publish a concurrent revision.
            onFailure: SCAN_LEASE_BUSY
          - id: MAP-002
            nameRu: Открыть сеанс сканирования
            invariant: BeginScanSession
            action: Create ScanSession bound to the current active MapRevision and scan start time.
            result: All diagnostics and indexed records are traceable to one scan.
        descriptionRu: ABCM фиксирует единственного владельца публикации и создаёт идентифицируемый сеанс. Все 
          дальнейшие записи и диагностики относятся к одной исходной ревизии.
      - id: MAP-P1
        nameRu: Проверка корневой области
        invariant: RootScopeValidation
        steps:
          - id: MAP-003
            nameRu: Прочитать манифест корня
            invariant: ReadRootScopeManifest
            action: Read root/scope.yaml and validate its schema and unique id.
          - id: MAP-004
            nameRu: Проверить тип корня
            invariant: ValidateRootScopeKind
            action: Require ScopeKind=workflow.
            onFailure: WORKSPACE_ROOT_MUST_BE_WORKFLOW
        descriptionRu: Корень workspace должен быть валидной областью workflow. Ошибка корня блокирует публикацию всей 
          карты, потому что у дерева нет надёжной точки отсчёта.
      - id: MAP-P2
        nameRu: Обнаружение областей
        invariant: ScopeDiscovery
        steps:
          - id: MAP-005
            nameRu: Обойти прямые дочерние каталоги
            invariant: EnumerateDirectChildDirectories
            action: For every valid ScopeNode, inspect direct child directories excluding reserved names.
          - id: MAP-006
            nameRu: Выделить кандидатов областей
            invariant: DetectScopeCandidates
            action: A child directory is a Scope candidate only when scope.yaml exists. A non-scope directory is not 
              recursively searched for hidden scopes in MVP.
          - id: MAP-007
            nameRu: Разобрать манифест области
            invariant: ParseScopeManifest
            action: Parse id, kind, name, aliases, owner, status and tags; retain parse diagnostics.
        descriptionRu: Сканер рассматривает только прямые незарезервированные дочерние каталоги валидной области. 
          Каталог без scope.yaml считается обычным содержимым и не скрывает внутри новый scope в MVP.
      - id: MAP-P3
        nameRu: Валидация топологии
        invariant: TopologyValidation
        steps:
          - id: MAP-008
            nameRu: Определить физического родителя
            invariant: ResolvePhysicalParent
            action: Set parentScopeId from the containing Scope directory; parent is never taken from scope.yaml.
          - id: MAP-009
            nameRu: Проверить ранг области
            invariant: ValidateScopeRank
            action: Require child.rank = parent.rank + 1 and the exact workflow-project-service-feature sequence.
          - id: MAP-010
            nameRu: Зафиксировать недопустимую ветку
            invariant: RecordInvalidBranch
            action: Store InvalidBranch and diagnostics, exclude it and its descendants from the active resolver graph, 
              continue other branches.
          - id: MAP-011
            nameRu: Проверить уникальность идентификаторов
            invariant: ValidateStableIdentifiers
            action: Require unique scope ids and aliases within the workspace.
            onFailure: SCOPE_ID_DUPLICATE
        descriptionRu: Физический родитель определяет место узла. ABCM проверяет точный rank, уникальность id/aliases и 
          переводит ошибочную ветку в InvalidBranch, не останавливая остальные ветки.
      - id: MAP-P4
        nameRu: Классификация и индексирование содержимого
        invariant: ContentClassificationAndIndexing
        steps:
          - id: MAP-012
            nameRu: Классифицировать файлы
            invariant: ClassifyFiles
            action: Apply managed-root, ignore, generated-resource, executable-resource and optional source-locator 
              rules before parsing content.
          - id: MAP-013
            nameRu: Собрать записи контекстных файлов
            invariant: BuildContextFileRecords
            action: Index allowed files in config, domain-language, agents, artifacts and architecture; exclude .abcm 
              and generated paths.
          - id: MAP-014
            nameRu: Собрать записи исполняемых ресурсов
            invariant: BuildExecutableResourceRecords
            action: Index skill/eval/statistics scripts as metadata-only ExecutableResourceRecord entries; do not parse 
              them as ordinary DocumentRecord bodies.
          - id: MAP-015
            nameRu: Обновить индекс путей исходного кода
            invariant: BuildSourceLocatorIndex
            action: When explicitly enabled, index project source paths and ownership metadata without reading their 
              bodies or exposing them in ScopeMapProjection.
          - id: MAP-016
            nameRu: Повторно использовать неизменённые контрольные суммы
            invariant: ReuseUnchangedChecksums
            action: Reuse checksums when path, size and mtime match; otherwise compute according to the file 
              classification policy.
          - id: MAP-017
            nameRu: Разобрать метаданные документов
            invariant: ParseDocumentMetadata
            action: Parse frontmatter, lifecycle, selectors, context policy, ownership, links, storage mode and 
              provenance into DocumentRecord.
          - id: MAP-018
            nameRu: Проверить идентификаторы документов
            invariant: ValidateDocumentIdentifiers
            action: Require stable unique document ids independently of filenames.
            onFailure: DOCUMENT_ID_DUPLICATE
        descriptionRu: ABCM сначала классифицирует файл. Обычный исходный код не становится документом карты; scripts 
          получают metadata-only запись, а опциональный SourceLocatorIndex хранит только пути и ownership.
      - id: MAP-P5
        nameRu: Построение связей и готовности
        invariant: RelationsAndReadiness
        steps:
          - id: MAP-019
            nameRu: Построить структурные связи
            invariant: BuildStructuralRelations
            action: Create parent-child ScopeRelation records.
          - id: MAP-020
            nameRu: Разрешить явные ссылки
            invariant: ResolveExplicitLinks
            action: Resolve abcm:// links and relations.yaml references; record unresolved links and whether they are 
              required.
          - id: MAP-021
            nameRu: Оценить готовность доменного языка
            invariant: EvaluateDomainLanguageReadiness
            action: Validate DomainLanguageConvention in every scope; inherit-only is valid; compute ScopeReadiness.
        descriptionRu: Структурные и явные связи объединяются в граф; ссылки abcm:// разрешаются; для каждой области 
          вычисляется готовность DomainLanguageConvention.
      - id: MAP-P6
        nameRu: Атомарная публикация
        invariant: AtomicMapPublication
        steps:
          - id: MAP-022
            nameRu: Сформировать черновик ревизии
            invariant: StageMapRevision
            action: Persist nodes, relations, files, documents, readiness and diagnostics under a non-active revision 
              id.
          - id: MAP-023
            nameRu: Вычислить дайджест ревизии
            invariant: ComputeMapRevisionDigest
            action: Compute a deterministic digest over normalized revision records.
          - id: MAP-024
            nameRu: Опубликовать ревизию карты
            invariant: PublishMapRevision
            action: In one database transaction mark the staged revision active and the previous revision inactive.
          - id: MAP-025
            nameRu: Отправить событие изменения карты
            invariant: EmitScopeMapChanged
            action: Emit revision id, digest, changed scopes and diagnostics summary.
          - id: MAP-026
            nameRu: Освободить аренду сканирования
            invariant: ReleaseScanLease
            action: Complete ScanSession and release the lease even on failure.
        descriptionRu: Новая карта сначала сохраняется как staged revision. После вычисления digest одна транзакция 
          делает её активной, поэтому читатели никогда не видят половину обновления.
    postconditions:
      - Readers observe a complete active MapRevision.
      - An unchanged FileWorkspace produces the same normalized map digest.
      - Invalid branches remain diagnosable but cannot be selected by buildTaskContext.
    pseudocode: "function buildScopeMap(workspaceRoot):\n  lease = acquireScanLease(workspaceRoot)\n  session = beginScanSession(activeMapRevision())\n\
      \  try:\n    root = validateRootScope(workspaceRoot)\n    queue = [root]\n    activeNodes = [root]\n    invalidBranches
      = []\n\n    while queue not empty:\n      parent = queue.pop()\n      for childDirectory in directNonReservedChildren(parent.path):\n\
      \        if not exists(childDirectory / \"scope.yaml\"):\n          continue\n        candidate = parseScopeManifest(childDirectory)\n\
      \        if not validChild(parent, candidate):\n          invalidBranches.append(recordInvalidBranch(candidate))\n \
      \         continue\n        activeNodes.append(candidate)\n        queue.push(candidate)\n\n    for scope in activeNodes:\n\
      \      indexScopeFilesIncrementally(scope)\n      parseDocumentRecords(scope)\n      resolveLinksAndRelations(scope)\n\
      \      evaluateScopeReadiness(scope)\n\n    staged = stageMapRevision(activeNodes, invalidBranches, indexes, diagnostics)\n\
      \    publishMapRevisionAtomically(staged)\n    emitScopeMapChanged(staged)\n    return staged\n  finally:\n    releaseScanLease(lease)"
  reconcileScopeMap:
    methodInvariant: reconcileScopeMap
    purposeRu: Обновить карту областей (ScopeMap) после локального изменения без отказа от периодической полной сверки.
    steps:
      - id: REC-001
        nameRu: Собрать события файловой системы
        invariant: CoalesceFilesystemEvents
        action: Coalesce duplicate create, modify, move and delete events for a short debounce window.
        actionRu: Объединить повторные create/modify/move/delete события за короткое debounce-окно.
      - id: REC-002
        nameRu: Найти ближайшую область
        invariant: FindNearestScopeRoot
        action: Walk upward to the nearest directory containing scope.yaml.
        actionRu: Подняться по дереву до ближайшего каталога с scope.yaml.
      - id: REC-003
        nameRu: Определить область влияния
        invariant: ComputeImpactSet
        action: Include changed scope, direct descendants, reverse abcm:// references and readiness dependencies.
        actionRu: Включить изменённую область, прямых потомков, обратные abcm:// ссылки и зависимости readiness.
      - id: REC-004
        nameRu: Пересканировать область влияния
        invariant: RescanImpactSet
        action: Run the same validation and indexing rules as buildScopeMap for the impact set.
        actionRu: Применить к области влияния те же правила валидации и индексирования, что и при полном buildScopeMap.
      - id: REC-005
        nameRu: Опубликовать новую ревизию
        invariant: PublishIncrementalMapRevision
        action: Publish a complete new MapRevision atomically; never patch the active revision in place.
        actionRu: Опубликовать новую полную MapRevision атомарно; активную ревизию не патчить на месте.
      - id: REC-006
        nameRu: Выполнить периодическую полную сверку
        invariant: RunPeriodicFullReconcile
        action: A scheduled full scan repairs missed network-filesystem notifications.
        actionRu: Периодически выполнять полный scan для восстановления событий, пропущенных сетевой файловой системой.
  getScopeMapProjection:
    methodInvariant: getScopeMap
    purposeRu: Вернуть ограниченную проекцию карты (ScopeMapProjection) для навигации или диагностики.
    steps:
      - id: PRJ-001
        nameRu: Закрепить ревизию карты
        invariant: PinMapRevision
        action: Load requested or active MapRevision.
        actionRu: Загрузить запрошенную либо текущую активную MapRevision.
      - id: PRJ-002
        nameRu: Проверить право обнаружения
        invariant: AuthorizeScopeDiscovery
        action: Apply scope.discover and scope.read_metadata permissions.
        actionRu: Применить права scope.discover и scope.read_metadata.
      - id: PRJ-003
        nameRu: Ограничить корень и глубину
        invariant: ApplyProjectionBounds
        action: Apply rootScopeId, depth and includeInvalid parameters.
        actionRu: Применить rootScopeId, depth и includeInvalid.
      - id: PRJ-004
        nameRu: Сохранить необходимую цепочку предков
        invariant: PreserveVisibleAncestorChain
        action: When a descendant is visible through a local grant, include minimal path-only ancestors without leaking 
          documents.
        actionRu: Если descendant видим по локальному grant, добавить только минимальную цепочку path-only предков без 
          утечки документов.
      - id: PRJ-005
        nameRu: Сформировать узлы проекции
        invariant: ProjectScopeNodes
        action: Return ids, kinds, canonical names, relative paths, direct children, relation summaries and readiness.
        actionRu: Вернуть ids, kinds, canonical names, paths, direct children, relation summaries и readiness.
      - id: PRJ-006
        nameRu: Добавить предупреждения
        invariant: AttachProjectionWarnings
        action: Attach only diagnostics relevant to visible scopes; admin may request invalid branches.
        actionRu: Добавить только diagnostics, относящиеся к видимым областям; admin может запросить InvalidBranch.
      - id: PRJ-007
        nameRu: Добавить точки разрешения
        invariant: AttachResolverEntrypoints
        action: Expose getDomainLanguage and buildTaskContext entrypoints instead of document bodies.
        actionRu: Показать entrypoints getDomainLanguage и buildTaskContext вместо тел документов.
      - id: PRJ-008
        nameRu: Вернуть проекцию карты
        invariant: ReturnScopeMapProjection
        action: Return ScopeMapProjection without placing it into an execution ContextBundle.
        actionRu: Вернуть ScopeMapProjection и не включать её автоматически в execution ContextBundle.
  getDomainLanguage:
    methodInvariant: getDomainLanguage
    purposeRu: Вернуть начальную доменную проекцию (DomainLanguageBootstrap), достаточную для формулирования запроса без
      чтения полной карты.
    inputs:
      - ContextAnchor
      - roleId?
      - projection=agent
    outputs:
      - DomainLanguageBootstrap
    steps:
      - id: DL-001
        nameRu: Аутентифицировать инициатора
        invariant: AuthenticatePrincipal
        action: Resolve principal and effective workspace/project permissions.
      - id: DL-002
        nameRu: Разрешить рабочую привязку
        invariant: ResolveContextAnchor
        action: Resolve workspace and project from explicit ids, repository locator or session binding.
      - id: DL-003
        nameRu: Закрепить ревизию карты
        invariant: PinMapRevision
        action: Load one active MapRevision for the entire request.
      - id: DL-004
        nameRu: Загрузить базовые конвенции
        invariant: LoadBaseDomainLanguageConventions
        action: Load accessible workflow and project DomainLanguageConvention sources.
      - id: DL-005
        nameRu: Проверить наследование
        invariant: ValidateDomainLanguageInheritance
        action: Validate required files, inherit-only declarations and locked concepts.
      - id: DL-006
        nameRu: Собрать начальную доменную проекцию
        invariant: BuildDomainLanguageBootstrap
        action: Merge canonical domains, concepts, aliases, deprecated terms, homonyms and naming rules into a compact 
          projection.
      - id: DL-007
        nameRu: Сохранить дайджест источников
        invariant: PersistBootstrapDigest
        action: Bind bootstrap to principal, anchor, MapRevision and source checksums.
      - id: DL-008
        nameRu: Вернуть идентификатор начальной проекции
        invariant: ReturnDomainLanguageBootstrap
        action: Return bootstrapId, digest, expiry and compact domain language.
  buildTaskContext:
    methodInvariant: buildTaskContext
    purposeRu: Собрать ограниченный воспроизводимый пакет контекста (ContextBundle) без чтения полной карты агентом и 
      без итеративного поиска.
    inputs:
      - DomainLanguageBootstrapId
      - roleId
      - taskType
      - goal
      - canonicalDomains?
      - canonicalTerms?
      - keywords?
      - targetHints?
      - explicitLinks?
      - artifacts?
      - budgetProfile?
      - requestedSkillIds?
      - explicitDocumentLinks?
    outputs:
      - ContextBundle
      - SkillContextRequirement[]
      - ConnectedSkillRecord[]
      - ContextFingerprint
      - ResolvedScopePath
      - optional ResolverTrace
    preconditions:
      - A non-stale DomainLanguageBootstrap exists and is bound to the caller.
      - A published MapRevision exists.
      - The role and task type are registered and readable.
    phases:
      - id: CTX-P0
        nameRu: Фиксация входов
        invariant: InputPinning
        steps:
          - id: CTX-001
            nameRu: Аутентифицировать инициатора
            invariant: AuthenticatePrincipal
            action: Resolve principal, tenant/workspace boundary and effective permissions.
          - id: CTX-002
            nameRu: Закрепить ревизию карты
            invariant: PinMapRevision
            action: Pin one active MapRevision for the complete build.
          - id: CTX-003
            nameRu: Проверить начальную доменную проекцию
            invariant: ValidateDomainLanguageBootstrap
            action: Verify principal binding, expiry, MapRevision and source convention digests.
            onFailure: DOMAIN_LANGUAGE_BOOTSTRAP_STALE
          - id: CTX-004
            nameRu: Загрузить профили сборки
            invariant: LoadBuildProfiles
            action: Load RoleProfile, TaskTypeProfile, BudgetProfile and explicit request options.
        descriptionRu: Сборка закрепляет principal, MapRevision, DomainLanguageBootstrap и профили роли/задачи/бюджета. 
          Все последующие решения относятся к одному набору входов.
      - id: CTX-P1
        nameRu: Нормализация намерения
        invariant: IntentNormalization
        steps:
          - id: CTX-005
            nameRu: Нормализовать цель задачи
            invariant: NormalizeTaskGoal
            action: Normalize goal text without changing its meaning; preserve the original goal.
          - id: CTX-006
            nameRu: Разрешить домены и термины
            invariant: ResolveCanonicalDomainsAndTerms
            action: Resolve canonical ids through DomainLanguageBootstrap; expand aliases and deprecated names.
          - id: CTX-007
            nameRu: Разобрать явные ссылки
            invariant: ParseExplicitLinks
            action: Validate and resolve syntax of abcm:// links without yet selecting document bodies.
          - id: CTX-008
            nameRu: Сформировать нормализованное намерение
            invariant: BuildNormalizedTaskIntent
            action: Create NormalizedTaskIntent containing original and canonical forms plus unresolved hints.
        descriptionRu: Свободная формулировка переводится в канонические домены, термины и ссылки. Неизвестные или 
          неоднозначные доменные понятия обрабатываются до поиска пути.
      - id: CTX-P2
        nameRu: Формирование области серверного поиска
        invariant: PathSearchUniverse
        steps:
          - id: CTX-009
            nameRu: Загрузить профиль разрешения пути
            invariant: LoadPathResolutionProfile
            action: Load deterministic scope-scoring rules for the role and task type.
          - id: CTX-010
            nameRu: Построить доступный универсум областей
            invariant: BuildCandidateScopeUniverse
            action: Build the server-side candidate universe from ContextAnchor, workspace/project boundary and 
              effective permissions.
          - id: CTX-011
            nameRu: Добавить точные подсказки
            invariant: AttachExactPathHints
            action: Add exact scope ids, repository paths, component names, artifact ownership and explicit abcm links 
              as resolution evidence.
          - id: CTX-012
            nameRu: Добавить связи графа
            invariant: AttachScopeRelations
            action: Attach readable domain, package, dependency and affects relations without exposing the full map to 
              the caller.
          - id: CTX-013
            nameRu: Зафиксировать границы поиска
            invariant: BoundPathSearchUniverse
            action: Persist candidate count and permission filters in ResolverTrace.
        descriptionRu: ABCM формирует внутренний серверный набор областей для разрешения пути. Это не стратегия skill и 
          не список документов для ContextBundle.
      - id: CTX-P3
        nameRu: Разрешение пути задачи
        invariant: ScopePathResolution
        steps:
          - id: CTX-014
            nameRu: Оценить кандидатов области
            invariant: ScoreScopeCandidates
            action: Score exact scope ids, explicit links, artifact ownership, repository path prefixes, canonical 
              domains/entities, aliases, relations, keywords and semantic matches in deterministic tiers.
          - id: CTX-015
            nameRu: Выбрать основную целевую область
            invariant: SelectPrimaryTargetScope
            action: Select one PrimaryTargetScope only when score, confidence and separation from the second candidate 
              meet configuration.
          - id: CTX-016
            nameRu: Определить затрагиваемые области
            invariant: ResolveAffectedScopes
            action: Add AffectedScope records through explicit relations, referenced contracts, artifacts and 
              cross-service links.
          - id: CTX-017
            nameRu: Построить разрешённый путь
            invariant: BuildResolvedScopePath
            action: Build physical ancestors from workflow to PrimaryTargetScope and attach resolution evidence.
          - id: CTX-018
            nameRu: Проверить путь
            invariant: ValidateResolvedScopePath
            action: Reject paths containing InvalidBranch or inaccessible mandatory ancestors.
        descriptionRu: 'Resolver оценивает кандидатов детерминированными слоями: точные ids/links, artifacts, repository paths,
          canonical concepts, relations и только затем semantic/keyword matches.'
      - id: CTX-P4
        nameRu: Уточнение доменного языка
        invariant: PathSpecificDomainLanguage
        steps:
          - id: CTX-019
            nameRu: Загрузить локальные конвенции
            invariant: LoadLocalDomainLanguageConventions
            action: Load service and feature DomainLanguageConvention for the resolved path.
          - id: CTX-020
            nameRu: Собрать эффективный доменный язык
            invariant: BuildEffectiveDomainLanguage
            action: Merge workflow-project-service-feature conventions; reject illegal locked overrides.
          - id: CTX-021
            nameRu: Повторно нормализовать локальные термины
            invariant: RenormalizeWithLocalDomainLanguage
            action: Apply local aliases and naming rules. If the target meaning changes, repeat ScopePathResolution 
              once; more than two total passes fails.
            onFailure: PATH_RESOLUTION_NOT_CONVERGED
        descriptionRu: После первого выбора пути добавляются service/feature конвенции. Если локальный alias меняет 
          смысл цели, разрешение пути разрешено повторить только один раз.
      - id: CTX-P5
        nameRu: Подключение skills
        invariant: SkillConnectionResolution
        steps:
          - id: CTX-SKL-001
            nameRu: Вызвать разрешение skills
            invariant: ResolveConnectedSkills
            action: Run resolveSkillConnections against the resolved path and normalized intent.
          - id: CTX-SKL-002
            nameRu: Добавить требования подключённых skills
            invariant: AttachSkillContextRequirements
            action: Add skill-declared required kinds, tags and explicit context links to document collection inputs 
              without suppressing MandatorySet.
        descriptionRu: Стратегия skill определяет, когда и как skill подключается. После подключения skill может 
          добавить требования к контексту, но не выбирает весь ContextBundle.
      - id: CTX-P6
        nameRu: Разрешение конфигурации
        invariant: EffectiveConfigurationResolution
        steps:
          - id: CTX-022
            nameRu: Слить конфигурацию пути
            invariant: MergePathConfiguration
            action: Merge workflow-project-service-feature config in order and enforce locked rules.
          - id: CTX-023
            nameRu: Вычислить применимые селекторы
            invariant: ResolveApplicableSelectors
            action: Resolve required, operator-controlled, role, task-type, lifecycle, access, exclusion and projection 
              rules.
        descriptionRu: Конфигурация сливается сверху вниз, а locked rules нельзя ослабить локально. Итог определяет 
          selectors, access, exclusions, projections и budget.
      - id: CTX-P7
        nameRu: Сбор обязательного набора
        invariant: MandatoryDocumentCollection
        steps:
          - id: CTX-024
            nameRu: Собрать обязательные документы
            invariant: CollectRequiredDocuments
            action: Collect required applicable and operator-controlled documents.
          - id: CTX-025
            nameRu: Добавить ролевые и задачные требования
            invariant: CollectRoleAndTaskRequiredDocuments
            action: Add role-required and task-type-required documents.
          - id: CTX-026
            nameRu: Добавить явные ссылки
            invariant: CollectExplicitLinkDocuments
            action: Add valid explicit links from request, role, skill and assignment.
          - id: CTX-027
            nameRu: Проверить доступ к обязательным документам
            invariant: AuthorizeMandatoryDocuments
            action: Fail rather than silently omit when a mandatory document is not readable.
            onFailure: REQUIRED_CONTEXT_ACCESS_DENIED
        descriptionRu: Сначала собираются required, operator-controlled, role/task required и explicit-link документы. 
          Недоступный mandatory document приводит к ошибке, а не к скрытому пропуску.
      - id: CTX-P8
        nameRu: Сбор релевантных кандидатов
        invariant: RelevantDocumentCollection
        steps:
          - id: CTX-028
            nameRu: Собрать документы целевой области
            invariant: CollectTargetScopeDocuments
            action: Collect task-compatible documents from PrimaryTargetScope and allowed ancestors/descendants 
              according to strategy.
          - id: CTX-029
            nameRu: Собрать документы связанных областей
            invariant: CollectRelatedScopeDocuments
            action: Collect documents from AffectedScope and explicit relation edges.
          - id: CTX-030
            nameRu: Собрать доменные совпадения
            invariant: CollectDomainAndEntityMatches
            action: Match canonical domains, entities, events and commands against the document index.
          - id: CTX-031
            nameRu: Собрать поисковые совпадения
            invariant: CollectSearchMatches
            action: Use keyword and semantic retrieval only after deterministic sources.
        descriptionRu: После обязательной части добавляются документы target scope, affected scopes, domain/entity 
          matches и поисковые совпадения.
      - id: CTX-P9
        nameRu: Очистка и разрешение конфликтов
        invariant: CandidateNormalizationAndConflicts
        steps:
          - id: CTX-032
            nameRu: Применить жизненный цикл документов
            invariant: ApplyDocumentLifecycle
            action: Exclude deleted, archived or superseded documents unless explicitly requested for audit.
          - id: CTX-033
            nameRu: Устранить дубликаты
            invariant: DeduplicateDocumentCandidates
            action: Deduplicate by stable document id and checksum while preserving all SelectionReason values.
          - id: CTX-034
            nameRu: Разрешить явные переопределения
            invariant: ResolveExplicitOverrides
            action: Use feature-service-project-workflow precedence only when override metadata explicitly names the 
              overridden rule or document.
          - id: CTX-035
            nameRu: Остановиться при защищённом конфликте
            invariant: StopOnOperatorControlledConflict
            action: Return a decision request for unresolved security, domain/business, performance or protected 
              architecture conflicts.
            onFailure: CONTEXT_CONFLICT_REQUIRES_OPERATOR
        descriptionRu: Lifecycle удаляет неактуальные версии, stable ids устраняют дубликаты, explicit override 
          разрешает локальный приоритет. Защищённый конфликт передаётся оператору.
      - id: CTX-P10
        nameRu: Ранжирование и проекция
        invariant: RankingAndProjection
        steps:
          - id: CTX-036
            nameRu: Назначить причины выбора
            invariant: AssignSelectionReasons
            action: Assign stable SelectionReason codes and deterministic priority tiers.
          - id: CTX-037
            nameRu: Выбрать проекцию документа
            invariant: SelectDocumentProjection
            action: Choose full, section, summary, metadata or reference according to role, task, document policy and 
              budget.
          - id: CTX-038
            nameRu: Зафиксировать источник сводки
            invariant: BindSummaryToSource
            action: A summary remains non-authoritative and MUST reference source document id and checksum.
        descriptionRu: Каждый кандидат получает SelectionReason и форму DocumentProjection. Один и тот же source может 
          быть полным для архитектора, разделом для reviewer и summary для executor.
      - id: CTX-P11
        nameRu: Применение бюджета
        invariant: ContextBudgetApplication
        steps:
          - id: CTX-039
            nameRu: Зарезервировать обязательный бюджет
            invariant: ReserveMandatoryBudget
            action: Materialize all mandatory entries first.
          - id: CTX-040
            nameRu: Проверить жёсткий лимит
            invariant: ValidateHardContextLimit
            action: If mandatory content exceeds hard limit, fail with contributing sources.
            onFailure: REQUIRED_CONTEXT_EXCEEDS_LIMIT
          - id: CTX-041
            nameRu: Заполнить необязательный бюджет
            invariant: FillOptionalBudget
            action: Add optional candidates by priority and utility per token until the soft/hard budget is reached.
          - id: CTX-042
            nameRu: Зафиксировать пропуски
            invariant: RecordOmissions
            action: Record omitted high-relevance candidates and reasons; low-value background MAY be omitted without 
              body.
        descriptionRu: Mandatory content резервируется первым. Необязательная часть заполняет оставшийся budget; 
          исключения и понижение проекции фиксируются в manifest.
      - id: CTX-P12
        nameRu: Формирование результата
        invariant: BundleMaterialization
        steps:
          - id: CTX-043
            nameRu: Сформировать пакет контекста
            invariant: MaterializeContextBundle
            action: Create immutable ContextBundle manifest and materialized content with pinned revisions and 
              projections.
          - id: CTX-044
            nameRu: Вычислить дайджест пакета
            invariant: ComputeContextBundleDigest
            action: Compute deterministic digest over normalized manifest and materialized content.
          - id: CTX-045
            nameRu: Записать отпечаток контекста
            invariant: WriteContextFingerprint
            action: Write selected files, checksums, map/config/domain-language revisions and projection modes under the
              run or assignment.
          - id: CTX-046
            nameRu: Вернуть минимальный результат
            invariant: ReturnBoundedContextResult
            action: Return ContextBundle, ResolvedScopePath, warnings, conflicts, omissions and optional ResolverTrace; 
              never return the full map by default.
        descriptionRu: ABCM создаёт immutable ContextBundle, вычисляет digest, сохраняет ContextFingerprint и возвращает
          агенту только ограниченный результат, а не полную карту.
    documentPriorityOrder:
      - required_applicable
      - operator_controlled_applicable
      - role_required
      - task_type_required
      - explicit_link
      - target_scope
      - related_scope
      - domain_or_entity_match
      - semantic_or_keyword_match
      - optional_background
    pseudocode: "function buildTaskContext(request, principal):\n  mapRevision = pinActiveMapRevision()\n  bootstrap = validateBootstrap(request.domainLanguageBootstrapId,
      principal, mapRevision)\n  profiles = loadRoleTaskBudgetProfiles(request)\n  normalizedIntent = normalizeIntent(request,
      bootstrap)\n\n  candidateUniverse = buildCandidateScopeUniverse(request.anchor, normalizedIntent, principal, profiles)\n\
      \  resolvedPath = resolveScopePath(candidateUniverse, normalizedIntent, mapRevision)\n  effectiveDomainLanguage = mergeDomainLanguage(resolvedPath)\n\
      \  normalizedIntent = renormalizeWithLocalLanguage(normalizedIntent, effectiveDomainLanguage)\n  if targetMeaningChanged(normalizedIntent,
      resolvedPath):\n    resolvedPath = resolveScopePath(candidateUniverse, normalizedIntent, mapRevision)  # one retry only\n\
      \n  connectedSkills, skillContextRequirements = resolveSkillConnections(\n    resolvedPath, normalizedIntent, profiles,
      request, principal, mapRevision)\n\n  effectiveConfig = mergePathConfiguration(resolvedPath)\n  mandatory = collectMandatoryDocuments(\n\
      \    effectiveConfig, profiles, request.explicitDocumentLinks, skillContextRequirements)\n  authorizeOrFail(mandatory,
      principal)\n  optional = collectRelevantCandidates(resolvedPath, candidateUniverse, normalizedIntent, profiles, connectedSkills)\n\
      \  candidates = applyLifecycleAccessDedupAndOverrides(mandatory + optional)\n  resolveProtectedConflictsOrFail(candidates)\n\
      \  projected = selectDocumentProjections(candidates, profiles)\n  materialized = applyContextBudget(projected, profiles.budget)\n\
      \n  bundle = createImmutableContextBundle(\n    mapRevision, resolvedPath, effectiveDomainLanguage, connectedSkills,
      materialized)\n  fingerprint = writeContextFingerprint(bundle)\n  return bundle, fingerprint\n"
  resolveSkillConnections:
    methodInvariant: resolveSkillConnections
    purposeRu: Определить, какие skills должны быть подключены к конкретной роли и задаче, не смешивая это решение с 
      выбором документов.
    inputs:
      - MapRevision
      - ResolvedScopePath
      - AffectedScopes
      - NormalizedTaskIntent
      - RoleProfile
      - TaskTypeProfile
      - explicitSkillLinks
      - requestedSkillIds
      - principal
    outputs:
      - ConnectedSkillRecord[]
      - SkillContextRequirement[]
      - SkillConnectionDiagnostic[]
    steps:
      - id: SKL-001
        nameRu: Построить доступный каталог skills
        invariant: BuildDiscoverableSkillCatalog
        action: Filter SkillDescriptor records by lifecycle, permissions and compatibility without loading all SKILL.md 
          bodies.
      - id: SKL-002
        nameRu: Подключить глобальные skills
        invariant: ConnectGlobalSkills
        action: Connect eligible workflow-owned skills with strategy=global; reject a global skill owned by a lower 
          scope.
      - id: SKL-003
        nameRu: Подключить skills области
        invariant: ConnectScopeSkills
        action: Connect strategy=scope skills whose owner scope is the primary target, an affected scope or an ancestor 
          of either.
      - id: SKL-004
        nameRu: Разрешить явные ссылки на skills
        invariant: ResolveLinkedSkills
        action: Resolve abcm://skill links from role, assignment, plan and request; fail when a required link is 
          unresolved.
      - id: SKL-005
        nameRu: Сопоставить skills по описанию
        invariant: MatchSkillsByDescription
        action: Score compact descriptors against normalized goal, role, task type, domains and terms; connect only 
          unambiguous matches above threshold.
      - id: SKL-006
        nameRu: Добавить вручную запрошенные skills
        invariant: AttachManualSkills
        action: Resolve requestedSkillIds and required approval records; manual skills are never selected implicitly.
      - id: SKL-007
        nameRu: Разрешить версии и дубликаты
        invariant: ResolveSkillVersionsAndDeduplicate
        action: Materialize one skill id/version, preserve all connection reasons, and apply 
          feature-service-project-workflow precedence unless locked.
      - id: SKL-008
        nameRu: Проверить зависимости и ресурсы
        invariant: ValidateSkillDependenciesAndResources
        action: Validate skill dependencies and executable resource activation separately from skill connection.
      - id: SKL-009
        nameRu: Материализовать подключённые skills
        invariant: MaterializeConnectedSkills
        action: Load full SKILL.md bodies for connected skills and emit SkillContextRequirement records for the document
          collector.
      - id: SKL-010
        nameRu: Зафиксировать причины подключения
        invariant: RecordSkillConnectionReasons
        action: Write strategy, reason, source scope, digest, match evidence and approval id into ConnectedSkillRecord.
    pseudocode: "function resolveSkillConnections(path, intent, profiles, request, principal, mapRevision):\n  catalog = discoverSkillDescriptors(mapRevision,
      principal, profiles)\n  candidates = []\n  candidates += connectGlobalSkills(catalog, workspace(path), profiles)\n \
      \ candidates += connectScopeSkills(catalog, path.primaryAndAffectedScopes())\n  candidates += resolveExplicitSkillLinks(catalog,
      profiles.links, request.explicitLinks)\n  candidates += matchSkillDescriptors(catalog, intent, profiles)\n  candidates
      += resolveManualSkills(catalog, request.requestedSkillIds)\n\n  connected = resolveVersionsAndDeduplicate(candidates)\n\
      \  validateDependenciesAndExecutableResources(connected, principal)\n  records = materializeSkillBodiesAndReasons(connected)\n\
      \  requirements = collectSkillContextRequirements(records)\n  return records, requirements\n"
  buildAgentMapView:
    deprecatedAliasOf: getScopeMapProjection
  writeFileThroughApi:
    steps:
      - id: WF-1
        action: authorize operation against target scope
      - id: WF-2
        action: validate reserved names, path and content schema
      - id: WF-3
        action: write temporary sibling file
      - id: WF-4
        action: flush and atomically rename
      - id: WF-5
        action: rescan affected path and dependencies
      - id: WF-6
        action: publish new map or document index revision

  synchronizeDocumentationSource:
    methodInvariant: synchronizeDocumentationSource
    purposeRu: Односторонне синхронизировать документацию из внешнего проекта в отдельный ABCM workspace без изменения 
      исходного проекта.
    steps:
      - id: SYNC-001
        nameRu: Закрепить источник и карту
        invariant: PinDocumentationSource
        action: Load approved DocumentationSource, connector revision and active MapRevision.
      - id: SYNC-002
        nameRu: Получить снимок исходных файлов
        invariant: ScanExternalDocumentation
        action: Apply include/exclude rules and classify matching external files.
      - id: SYNC-003
        nameRu: Сопоставить исходные и целевые пути
        invariant: MapDocumentationTargets
        action: Apply deterministic mapping rules; ambiguous mappings become conflicts.
      - id: SYNC-004
        nameRu: Сравнить происхождение и контрольные суммы
        invariant: CompareSourceProvenance
        action: Compare source path, revision and checksum with current mirror records.
      - id: SYNC-005
        nameRu: Применить создания и изменения
        invariant: ApplyMirrorUpserts
        action: Copy new or changed files through temporary-file plus atomic-rename writes.
      - id: SYNC-006
        nameRu: Применить перемещения
        invariant: ApplyMirrorMoves
        action: Preserve stable document identity when provenance or checksum allows; otherwise model as delete+create.
      - id: SYNC-007
        nameRu: Применить удаления
        invariant: ApplyMirrorDeletions
        action: Delete active mirror copies missing from the canonical source, persist tombstones, and emit 
          protected-document diagnostics when applicable.
      - id: SYNC-008
        nameRu: Пересобрать затронутую карту
        invariant: ReconcileSynchronizedScopes
        action: Run reconcileScopeMap for all changed target scopes and publish a complete MapRevision.
      - id: SYNC-009
        nameRu: Сохранить отчёт синхронизации
        invariant: PersistSyncRun
        action: Persist created, updated, moved, deleted, skipped and conflicted counts with source revision.
  cutoverDocumentationSource:
    methodInvariant: cutoverDocumentationSource
    purposeRu: Передать каноническое владение документами от репозитория к отдельному ABCM workspace.
    preconditions:
      - operator approval
      - no unresolved source-target conflicts
      - a successful final sync
      - matching checksums
    steps:
      - id: CUT-001
        nameRu: Остановить изменения источника
        invariant: CoordinateSourceFreeze
        action: Record the source revision selected for cutover and require operational coordination of concurrent 
          edits.
      - id: CUT-002
        nameRu: Выполнить финальную синхронизацию
        invariant: RunFinalMirrorSync
        action: Synchronize the selected source revision into ABCM.
      - id: CUT-003
        nameRu: Проверить контрольные суммы
        invariant: VerifyCutoverChecksums
        action: Require every selected source file to match its ABCM copy.
        onFailure: CUTOVER_CHECKSUM_MISMATCH
      - id: CUT-004
        nameRu: Опубликовать план передачи
        invariant: PublishCutoverPlan
        action: Show documents changing from mirror to managed and all source mappings that will be disabled.
      - id: CUT-005
        nameRu: Атомарно сменить режим хранения
        invariant: ActivateManagedStorage
        action: Mark the selected ABCM copies managed and disable source deletion propagation in one transaction.
      - id: CUT-006
        nameRu: Не изменять исходный проект
        invariant: PreserveExternalProject
        action: Do not delete, rewrite or replace repository files automatically; optional pointer stubs are an explicit
          external operation.
      - id: CUT-007
        nameRu: Опубликовать новую карту
        invariant: PublishPostCutoverMap
        action: Reconcile affected scopes and publish a new MapRevision with managed provenance.
