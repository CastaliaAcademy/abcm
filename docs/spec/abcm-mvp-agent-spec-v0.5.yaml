# 5. Сквозные решения, ошибки и проверка реализации (CrossCuttingSpecification)
architectureDecisions:
  - id: FAD-001
    title: Flat physical scope nesting instead of type container directories
    problem: A literal workflows/projects/services/features directory model creates long paths and repeats information 
      already present in scope.yaml.
    options:
      - nested type containers
      - flat scope directories with manifest kind
    decision: flat scope directories with scope.yaml
    rationale:
      - shorter paths on network shares
      - easier manual navigation
      - object model remains strict without mirroring it in folder names
    consequences:
      - scanner must validate hierarchy ranks
      - reserved content directory names are required
    titleRu: Плоское физическое вложение областей
    problemRu: Буквальные каталоги workflows/projects/services/features удлиняют пути и повторяют информацию из 
      scope.yaml.
    decisionRu: Использовать прямое вложение каталогов областей, а тип хранить в scope.yaml.
    consequencesRu:
      - Сканер валидирует ranks.
      - Имена содержательных папок резервируются.
  - id: FAD-002
    title: Physical parent is authoritative
    problem: a parent field can contradict the real directory tree
    options:
      - parent id in scope.yaml
      - parent derived from directory nesting
    decision: derive parent from physical directory nesting and forbid parent field
    rationale:
      - prevents split-brain topology
      - enables map rebuild without external registry
    consequences:
      - moving a directory changes its parent and triggers validation
    titleRu: Физический родитель является источником истины
    problemRu: Поле parent может противоречить реальному дереву каталогов.
    decisionRu: Определять parent по физическому вложению и запретить parent в manifest.
    consequencesRu:
      - Перемещение каталога меняет parent и запускает валидацию.
  - id: FAD-003
    title: Hidden SQLite database for derived state
    problem: users should not edit indexes, locks, map snapshots and runtime metadata
    options:
      - visible _meta and _system directories
      - hidden .abcm database
    decision: store derived and runtime state in .abcm/abcm.sqlite
    rationale:
      - clean human-facing tree
      - atomic map publication
      - index can be rebuilt from files
    consequences:
      - database must never be the only copy of user content
      - one service process owns the database
    titleRu: Скрытая SQLite для производного состояния
    problemRu: Пользователь не должен редактировать индексы, locks, snapshots и runtime metadata.
    decisionRu: Хранить производные и runtime данные в .abcm/abcm.sqlite.
    consequencesRu:
      - База не является единственной копией пользовательского содержимого.
      - Базой владеет один service process.
  - id: FAD-004
    title: Filesystem as source of truth
    problem: a network-share MVP must remain readable without ABCM UI or database
    options:
      - database canonical
      - filesystem canonical
    decision: filesystem canonical, SQLite rebuildable
    rationale:
      - portability
      - human editability
      - simple backup and synchronization
    consequences:
      - file writes require atomic rename and rescan
      - initial scans are more expensive than DB-only startup
    titleRu: Файловая система как источник истины
    problemRu: MVP на сетевой папке должен читаться без UI и базы ABCM.
    decisionRu: Считать файловую систему канонической, а SQLite - пересобираемой.
    consequencesRu:
      - Записи требуют atomic rename и rescan.
      - Первичный scan дороже DB-only startup.
  - id: FAD-005
    title: Architecture separate from artifacts
    problem: high-level diagrams and generated images have different lifecycle and retrieval rules from ADR, RFC and 
      plans
    options:
      - store everything under artifacts
      - keep architecture as top-level scope content
    decision: architecture remains separate
    rationale:
      - clear high-abstraction entry point
      - rendered diagrams can be excluded from normal context scanning
    consequences:
      - ADR remains under artifacts/adr and may link to architecture
    titleRu: Architecture отдельно от artifacts
    problemRu: Диаграммы высокой абстракции и generated images имеют другой lifecycle и retrieval rules, чем 
      ADR/RFC/plans.
    decisionRu: Оставить architecture отдельной верхнеуровневой зоной scope.
    consequencesRu:
      - ADR остаётся в artifacts/adr и может ссылаться на architecture.
  - id: FAD-006
    title: Optional domain and worker filename prefixes
    problem: MVP needs atomic ownership hints without forcing every artifact to belong to one worker
    options:
      - worker always required
      - metadata only
      - optional routing prefixes plus authoritative frontmatter
    decision: optional prefixes, frontmatter authoritative
    rationale:
      - ordinary team-owned ADR stays simple
      - temporary worker routing remains possible
    consequences:
      - renaming a file must not change artifact identity
    titleRu: Необязательные domain/worker prefixes
    problemRu: Нужны временные hints владения, но не каждый артефакт принадлежит одному worker.
    decisionRu: Разрешить optional prefixes, а frontmatter считать authoritative.
    consequencesRu:
      - Обычный team-owned ADR остаётся коротким.
      - Переименование файла не меняет id.
  - id: FAD-007
    title: Domain language before path resolution
    problem: path resolution based on unnormalized words causes ambiguous or incorrect scope selection
    options:
      - resolve scope path first
      - build EffectiveDomainLanguage first
    decision: get DomainLanguageConvention before resolving the execution path
    rationale:
      - agents use canonical terms
      - aliases and homonyms are resolved before map search
    consequences:
      - buildTaskContext requires a valid bootstrap
      - missing conventions are a configuration error
    titleRu: Доменный язык до разрешения пути
    problemRu: Поиск по ненормализованным словам даёт неоднозначный или неверный scope.
    decisionRu: Получать DomainLanguageConvention до выбора execution path.
    consequencesRu:
      - buildTaskContext требует bootstrap.
      - Отсутствующая конвенция является configuration error.
  - id: FAD-008
    title: Server-side dynamic context construction
    problem: making the agent read the complete map and iteratively search consumes tokens and pollutes its context
    options:
      - agent-driven map traversal
      - atomic server-side buildTaskContext
    decision: buildTaskContext performs map traversal internally
    rationale:
      - bounded token footprint
      - reproducible selection
      - agents do not require full-map permission
    consequences:
      - resolver quality becomes a core ABCM responsibility
      - every selected document needs a selection reason
    titleRu: Серверная сборка динамического контекста
    problemRu: Чтение полной карты и итеративный поиск расходуют tokens и загрязняют agent context.
    decisionRu: Выполнять traversal внутри atomic buildTaskContext.
    consequencesRu:
      - Token footprint ограничен.
      - Каждый selected document получает SelectionReason.
  - id: FAD-009
    title: Stable abcm URIs instead of network paths
    problem: SMB and NFS mount paths change across hosts and operating systems
    options:
      - absolute filesystem paths
      - relative paths only
      - stable abcm URIs resolved by index
    decision: abcm URI is canonical for links; relative path is diagnostic
    rationale:
      - portable links
      - stable references after workspace relocation
    consequences:
      - ids must be unique within workspace
      - unresolved URI diagnostics are required
    titleRu: Стабильные abcm URI вместо сетевых путей
    problemRu: SMB/NFS mount paths различаются между hosts и OS.
    decisionRu: Использовать abcm URI как canonical link, relative path - только для диагностики.
    consequencesRu:
      - Ids должны быть уникальны.
      - Unresolved URI получают diagnostics.
  - id: FAD-010
    title: Skill strategy controls connection, not document retrieval
    problem: The former model interpreted global, scope, by-link, by-description and manual as ways to search documents,
      while they actually describe when and how an agent connects a skill.
    options:
      - keep skill strategy coupled to document selection
      - separate SkillConnectionStrategy from ContextBundle document selection
    decision: Store SkillConnectionStrategy in metadata.abcm-skill-strategy and resolve it after task path resolution. 
      buildTaskContext remains responsible for document selection.
    rationale:
      - the five values directly describe skill activation situations
      - global and scope are placement rules; by-link and by-description are discovery rules; manual is explicit 
        selection
      - connected skills may declare context requirements without owning the entire context algorithm
    consequences:
      - metadata.abcm-context-strategy is deprecated as a skill field
      - metadata.abcm-context-base is removed from skill semantics
      - ContextBundle and ContextFingerprint record connected skills and connection reasons
    titleRu: Стратегия skill определяет подключение, а не поиск документов
    problemRu: Прежняя модель ошибочно трактовала global, scope, by-link, by-description и manual как способы поиска 
      документов, хотя они задают ситуацию и способ подключения skill к агенту.
    decisionRu: Хранить SkillConnectionStrategy в metadata.abcm-skill-strategy и разрешать её после определения пути 
      задачи. Выбор документов остаётся обязанностью buildTaskContext.
    consequencesRu:
      - metadata.abcm-context-strategy объявляется deprecated для skills.
      - metadata.abcm-context-base удаляется из skill semantics.
      - ContextBundle хранит ConnectedSkillRecord и SkillConnectionReason.
  - id: ADR-MVP-011
    problem: The same source document has different value for implementation, review and architecture tasks.
    options:
      - Always load the full document
      - Create role-specific copies
      - Use role/task-specific DocumentProjection
    decision: Use DocumentProjection while preserving one authoritative source.
    consequences:
      - Lower token use
      - No duplicated source truth
      - Bundle must record projection and checksum
    titleRu: Role/task-specific DocumentProjection
    problemRu: Один source document имеет разную полезность для implementation, review и architecture tasks.
    decisionRu: Использовать DocumentProjection при одном authoritative source.
    consequencesRu:
      - Ниже token use.
      - Нет копий источника истины.
      - Bundle фиксирует projection и checksum.
  - id: ADR-MVP-012
    problem: A map scan may expose a partially updated graph to readers.
    options:
      - Patch active rows in place
      - Lock all readers
      - Stage and atomically activate MapRevision
    decision: Stage a complete revision and atomically switch the active revision.
    consequences:
      - Consistent reads
      - Short-lived duplicate index data
      - Simple rollback to previous revision
    titleRu: Атомарная активация MapRevision
    problemRu: Сканирование может показать читателю частично обновлённый graph.
    decisionRu: Собрать полную staged revision и атомарно переключить active revision.
    consequencesRu:
      - Consistent reads.
      - Кратковременно дублируются index rows.
      - Простой rollback на previous revision.

  - id: ADR-MVP-013
    title: ScopeMap is not a source-code tree
    problem: Indexing every .js/.ts/.py file as a context document makes map rebuilds expensive and leaks irrelevant 
      code into agent navigation.
    options:
      - index all files as documents
      - ignore all code
      - separate document, executable-resource and source-locator indexes
    decision: Use separate records; ordinary project code is ignored by the document index by default.
    consequences:
      - ScopeMapProjection stays compact
      - skill scripts remain discoverable as executable metadata
      - optional source locator indexing can help path resolution without loading code bodies
    titleRu: ScopeMap не является деревом исходного кода
    problemRu: Индексирование каждого .js/.ts/.py как документа раздувает карту и подмешивает нерелевантный код.
    decisionRu: Разделить DocumentRecord, ExecutableResourceRecord и optional SourceLocatorRecord.
    consequencesRu:
      - ScopeMapProjection остаётся компактной.
      - Skill scripts видны как metadata.
      - Код читается только адресно.
  - id: ADR-MVP-014
    title: Single-authority documentation synchronization
    problem: Projects may keep documentation beside code while ABCM needs a separate shared workspace; bidirectional 
      synchronization creates conflicts and split ownership.
    options:
      - two-way sync
      - copy once
      - one-way mirror with explicit managed cutover
    decision: Use mirror mode for adoption and an operator-controlled cutover to managed mode.
    consequences:
      - ABCM never modifies the source project automatically
      - source deletion propagates only in mirror mode
      - after cutover the ABCM copy is canonical and source deletion no longer affects it
    titleRu: Один канонический источник документации
    problemRu: Документация рядом с кодом и отдельный workspace создают риск двух независимых master-копий.
    decisionRu: Использовать односторонний mirror и явный cutover в managed mode.
    consequencesRu:
      - ABCM не изменяет source project автоматически.
      - Удаление источника распространяется только в mirror mode.
      - После cutover каноничен ABCM workspace.
