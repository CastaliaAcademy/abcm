    full: Complete document body.
    section: Only selected named sections plus source reference and checksum.
    summary: Pre-authored or deterministic summary plus source reference; generated summaries are non-authoritative.
    metadata: Frontmatter and routing metadata only.
    reference: URI, title, checksum and reason; body is fetched only on explicit follow-up.
    omitted: Not included; omission reason remains in the bundle manifest when relevant.
