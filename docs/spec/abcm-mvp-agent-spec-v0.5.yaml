requirements:
  - id: FS-001
    level: MUST
    statement: One workspace directory MUST contain exactly one root workflow scope.
  - id: FS-002
    level: MUST
    statement: A directory MUST be treated as a scope only when scope.yaml exists.
  - id: FS-003
    level: MUST
    statement: Scope hierarchy MUST be workflow -> project -> service -> feature with no skipped or repeated ranks.
  - id: FS-004
    level: MUST_NOT
    statement: An invalid branch MUST NOT participate in buildTaskContext.
  - id: FS-005
    level: MUST
    statement: The remaining valid workspace branches MUST continue to be scanned when one branch is invalid.
  - id: FS-006
    level: MUST
    statement: The filesystem MUST remain the canonical source of user-authored content.
  - id: FS-007
    level: MUST
    statement: .abcm/abcm.sqlite MUST be rebuildable from filesystem content except ephemeral runtime state.
  - id: FS-008
    level: MUST_NOT
    statement: Multiple hosts or processes MUST NOT write directly to the workspace SQLite database.
  - id: FS-009
    level: MUST_NOT
    statement: WAL mode MUST NOT be used when the SQLite file is on a network filesystem.
  - id: FS-010
    level: MUST
    statement: API writes MUST use a temporary file and atomic rename.
  - id: SCP-001
    level: MUST
    statement: Parent scope MUST be derived from physical directory nesting.
  - id: SCP-002
    level: MUST_NOT
    statement: scope.yaml MUST NOT declare a parent field in MVP.
  - id: SCP-003
    level: MUST
    statement: Reserved content directory names MUST NOT be used as child scope ids.
  - id: DLC-001
    level: MUST
    statement: DomainLanguageConvention MUST exist at every valid scope, including explicit inherit-only documents.
  - id: DLC-002
    level: MUST
    statement: Effective domain language MUST be built before service or feature path resolution.
  - id: DLC-003
    level: MUST
    statement: Unknown domain ids and unknown canonical terms MUST fail context construction by default.
  - id: DLC-004
    level: MAY
    statement: Unknown free keywords MAY be used as non-authoritative retrieval hints.
  - id: AGT-001
    level: MUST
    statement: Agent roles MUST be stored under agents/roles.
  - id: AGT-002
    level: MUST
    statement: Agent skills MUST be stored under agents/skills/<name>/SKILL.md.
  - id: AGT-003
    level: MUST
    statement: Skill connection strategy MUST be stored in metadata.abcm-skill-strategy.
  - id: AGT-004
    level: MUST
    statement: metadata.abcm-skill-strategy MUST be one of global, scope, by-link, by-description or manual.
  - id: AGT-005
    level: MUST
    statement: A global skill MUST be owned by workflow scope and MUST connect to every eligible task after access, 
      lifecycle and compatibility checks.
  - id: AGT-006
    level: MUST
    statement: A scope skill MUST connect when its owner scope is the primary target, an affected scope or an ancestor 
      of either.
  - id: AGT-007
    level: MUST
    statement: A by-link skill MUST recognize explicit abcm://skill URIs from role descriptions/frontmatter, 
      assignments, plans and requests.
  - id: AGT-008
    level: MUST
    statement: A by-description skill MUST be matched from compact SkillDescriptor metadata against normalized role, 
      task type, goal, domains and terms.
  - id: AGT-009
    level: MUST
    statement: A manual skill MUST NOT be connected unless requestedSkillIds or an approved decision names it 
      explicitly.
  - id: AGT-010
    level: MUST
    statement: The full SKILL.md body MUST be materialized only after the skill is connected; scripts, references and 
      assets MUST remain separate addressable resources.
  - id: AGT-011
    level: MUST
    statement: A connected skill MAY add SkillContextRequirement records but MUST NOT own or replace the complete 
      ContextBundle selection algorithm.
  - id: AGT-012
    level: MUST
    statement: ConnectedSkillRecord MUST preserve strategy, source scope, digest and all independent connection reasons.
  - id: AGT-013
    level: MUST
    statement: Legacy metadata.abcm-context-strategy MUST map to metadata.abcm-skill-strategy and emit 
      SKILL_CONTEXT_STRATEGY_DEPRECATED until version 1.0.
  - id: AGT-014
    level: MUST
    statement: Legacy metadata.abcm-context-base MUST be ignored for skill connection and emit 
      SKILL_CONTEXT_BASE_REMOVED until version 1.0.
  - id: ART-001
    level: MUST
    statement: ADR, RFC, technical debt, conventions, plans, reports and evals MUST be placed under artifacts.
  - id: ART-002
    level: MUST
    statement: PlantUML and high-abstraction architecture documents MUST be placed under architecture.
  - id: ART-003
    level: MUST_NOT
    statement: Worker id MUST NOT be mandatory in artifact filenames.
  - id: ART-004
    level: MUST
    statement: Artifact frontmatter id MUST remain stable across filename changes.
  - id: ART-005
    level: MUST
    statement: Accepted ADR and RFC content MUST be treated as immutable unless an explicit amendment workflow is used.
  - id: CTX-001
    level: MUST
    statement: buildTaskContext MUST not require the caller to read the full map.
  - id: CTX-002
    level: MUST
    statement: Every selected document MUST include a selection reason in the ContextBundle manifest.
  - id: CTX-003
    level: MUST
    statement: required documents MUST outrank role selection rules and MUST NOT be silently removed for budget.
  - id: CTX-004
    level: MUST
    statement: buildTaskContext MUST write a reproducible ContextFingerprint.
  - id: CTX-005
    level: MUST_NOT
    statement: A ContextFingerprint MUST NOT duplicate all selected document bodies.
  - id: MAP-001
    level: MUST
    statement: Full map responses MUST not load document bodies.
  - id: MAP-002
    level: MUST
    statement: Agent map view MUST expose resolver entrypoints, readiness and relevant warnings.
  - id: MAP-003
    level: MUST
    statement: Missing DomainLanguageConvention MUST produce map warnings and context-build errors.
  - id: LNK-001
    level: MUST
    statement: Cross-scope references MUST use stable abcm URIs rather than absolute network paths.
  - id: LNK-002
    level: MUST
    statement: Unresolved required links MUST fail context construction.
  - id: MAP-004
    level: MUST
    statement: Map construction MUST publish a complete new MapRevision atomically and MUST NOT mutate the active 
      revision in place.
  - id: MAP-005
    level: MUST
    statement: Scope discovery MUST inspect direct non-reserved child directories of each valid scope; hidden scopes 
      behind ordinary directories are not supported in MVP.
  - id: MAP-006
    level: MUST
    statement: Map construction MUST preserve InvalidBranch diagnostics while excluding invalid branches from the active
      resolver graph.
  - id: MAP-007
    level: MUST
    statement: A periodic full reconcile scan MUST exist even when filesystem notifications are enabled.
  - id: MAP-008
    level: MUST
    statement: An unchanged FileWorkspace MUST produce an equivalent normalized map digest.
  - id: MAP-009
    level: MUST
    statement: ScopeMapProjection MUST be permission-filtered and MUST NOT expose document bodies.
  - id: MAP-010
    level: MUST
    statement: The agent projection MUST expose resolver entrypoints so agents can build context without traversing the 
      full map.
  - id: CTX-006
    level: MUST
    statement: buildTaskContext MUST pin one MapRevision and use it for the entire build.
  - id: CTX-007
    level: MUST
    statement: SkillConnectionStrategy MUST determine skill connection only and MUST NOT suppress mandatory inherited 
      context.
  - id: CTX-008
    level: MUST
    statement: A manual skill MUST be connected only from requestedSkillIds or an explicit approval decision.
  - id: CTX-009
    level: MUST
    statement: A mandatory document that is not readable by the caller MUST fail the build with 
      REQUIRED_CONTEXT_ACCESS_DENIED.
  - id: CTX-010
    level: MUST
    statement: Path resolution MUST occur after DomainLanguageBootstrap validation and MAY perform at most one bounded 
      re-resolution after local DomainLanguageConvention is merged.
  - id: CTX-011
    level: MUST
    statement: Every selected document MUST declare a DocumentProjection mode.
  - id: CTX-012
    level: MUST
    statement: A summary projection MUST reference the authoritative source document id and checksum and MUST be marked 
      non-authoritative.
  - id: CTX-013
    level: MUST
    statement: The same document MAY use different DocumentProjection modes for different role, task type, 
      connected-skill set and budget combinations.
  - id: CTX-014
    level: MUST
    statement: ContextBundle MUST record MapRevision, DomainLanguageConvention digests, role, task type, connected skill
      ids/digests/reasons, budget profile, selection reasons and projection modes.
  - id: CTX-015
    level: MUST
    statement: ContextFingerprint MUST record the actual materialized projection of each selected document.
  - id: CTX-016
    level: MUST_NOT
    statement: Full ScopeMap MUST NOT be inserted into an execution ContextBundle by default.
  - id: DLC-005
    level: MUST
    statement: getDomainLanguage MUST return workflow and project DomainLanguageConvention as DomainLanguageBootstrap 
      before final task path resolution.
  - id: DLC-006
    level: MUST
    statement: After path resolution, buildTaskContext MUST merge service and feature DomainLanguageConvention into 
      EffectiveDomainLanguage.

  - id: MAP-011
    level: MUST_NOT
    statement: ScopeMapProjection MUST NOT expose the complete project source tree or individual ordinary source files.
  - id: MAP-012
    level: MUST
    statement: Executable skill, eval and statistics scripts MUST be classified as ExecutableResourceRecord rather than 
      ordinary DocumentRecord.
  - id: MAP-013
    level: MUST_NOT
    statement: Ordinary project .js, .ts, .py and similar source files MUST NOT enter the document index by default.
  - id: MAP-014
    level: MAY
    statement: ABCM MAY maintain a metadata-only SourceLocatorIndex when explicitly enabled.
  - id: MAP-015
    level: MUST_NOT
    statement: SourceLocatorIndex MUST NOT store source file bodies.
  - id: SYNC-001
    level: MUST
    statement: Every synchronized document MUST have exactly one canonical storage location determined by StorageMode.
  - id: SYNC-002
    level: MUST_NOT
    statement: ABCM MUST NOT perform automatic two-way documentation synchronization.
  - id: SYNC-003
    level: MUST
    statement: Mirror mode MUST synchronize external documentation to ABCM without modifying the source project.
  - id: SYNC-004
    level: MUST
    statement: Deleting a canonical source file in mirror mode MUST remove its active ABCM mirror and persist a 
      tombstone.
  - id: SYNC-005
    level: MUST
    statement: Initial documentation import MUST produce a preview before applying mappings.
  - id: SYNC-006
    level: MUST
    statement: Cutover from mirror to managed mode MUST be operator-controlled and checksum-verified.
  - id: SYNC-007
    level: MUST_NOT
    statement: ABCM MUST NOT automatically delete or rewrite source repository files during cutover.
acceptanceScenarios:
  - id: AC-001
    title: Rebuild map after deleting SQLite
    given: a valid workspace and deleted .abcm/abcm.sqlite
    when: ABCM starts
    then:
      - the database is recreated
      - scope ids, hierarchy, file index and warnings match the filesystem
  - id: AC-002
    title: Reject a workflow nested under a project
    given: project-1/internal-workflow/scope.yaml declares workflow
    when: the workspace is scanned
    then:
      - the branch is marked invalid
      - other projects remain available
      - buildTaskContext for the invalid branch fails
  - id: AC-003
    title: Use ADR without worker prefix
    given: artifacts/adr/ADR-0001--decision.md with valid frontmatter
    when: the scope is scanned
    then:
      - the artifact is indexed
      - worker is null
      - artifact id is ADR-0001
  - id: AC-004
    title: Build context without full map access
    given: an agent with context.build permission but no map.read.full permission
    when: it calls getDomainLanguage and buildTaskContext
    then:
      - context is returned for accessible scopes
      - the full map is not disclosed
  - id: AC-005
    title: Fail when DomainLanguageConvention is missing
    given: a feature scope without DomainLanguageConvention.md
    when: the map and context methods are called
    then:
      - map returns 200 with a warning
      - buildTaskContext returns configuration error
  - id: AC-007
    title: Preserve artifact identity after rename
    given: ADR-0001--old-name.md is renamed to ADR-0001--new-name.md
    when: ABCM rescans
    then:
      - one artifact with id ADR-0001 remains
      - its path changes
      - links by abcm URI remain valid
  - id: AC-008
    title: Context fingerprint for a subagent
    given: an orchestrator dispatches an assignment
    when: buildTaskContext creates the child bundle
    then:
      - a fingerprint is written under context-fingerprints/subagents/<assignment-id>/<run-id>
      - each selected file has checksum and selection reason
  - id: AC-MAP-ATOMIC
    given: An active MapRevision exists and a scan is building a new revision.
    when: A client reads the map during publication.
    then: The client observes either the complete old revision or the complete new revision, never a partial map.
  - id: AC-CONTEXT-PROJECTION
    given: The same ADR is relevant to executor, quality-gate and architecture-designer roles.
    when: Three builds are created for implementation, review and architecture review.
    then: The ADR may be full, section or full respectively, and every bundle records the projection and source 
      checksum.
  - id: AC-CONTEXT-NO-FULL-MAP
    given: An agent can call buildTaskContext but lacks scope_map.read_full.
    when: The agent requests task context using a valid DomainLanguageBootstrap.
    then: The service resolves the path internally and returns a ContextBundle without exposing the full map.
  - id: AC-MANDATORY-ACCESS
    given: A required security document is applicable but not readable by the caller.
    when: buildTaskContext is called.
    then: The build fails with REQUIRED_CONTEXT_ACCESS_DENIED and does not silently omit the document.
  - id: AC-LOCAL-DOMAIN-RERESOLVE
    given: A service DomainLanguageConvention adds an alias that refines the initially selected feature.
    when: buildTaskContext merges local conventions.
    then: The resolver performs at most one additional path-resolution pass and records both passes in ResolverTrace.

# 6. Терминологическая политика и глоссарий (TerminologyAndGlossary)
  - id: AC-SKILL-GLOBAL
    title: Connect workflow-wide baseline skill
    given: a workflow-owned skill declares abcm-skill-strategy=global and is compatible with executor-agent
    when: buildTaskContext resolves any eligible project task
    then:
      - the skill is connected once
      - reason global_workspace_baseline is recorded
      - no workflow document is loaded merely because the skill is global
  - id: AC-SKILL-SCOPE
    title: Connect scope skill to descendants only
    given: a project-owned skill declares abcm-skill-strategy=scope
    when: one task targets a descendant feature and another targets a different project
    then:
      - the descendant task receives the skill
      - the unrelated project task does not
  - id: AC-SKILL-BY-LINK
    title: Connect exact skill from role link
    given: quality-gate-agent contains abcm://skill/security-review and that skill declares by-link
    when: buildTaskContext runs for the role
    then:
      - the exact skill id/digest is connected
      - reason explicit_skill_link is recorded
      - an unresolved required link fails with REQUIRED_SKILL_LINK_UNRESOLVED
  - id: AC-SKILL-BY-DESCRIPTION
    title: Connect skill from normalized task description
    given: prisma-major-upgrade declares by-description and its descriptor matches task type, domain and goal
    when: the match exceeds threshold and is separated from the second candidate
    then:
      - the skill is connected
      - match score and evidence are recorded
      - unrelated SKILL.md bodies are not loaded
  - id: AC-SKILL-MANUAL
    title: Connect experimental skill only by explicit request
    given: experimental-event-store-rewrite declares manual
    when: the operator supplies requestedSkillIds with an approval decision
    then:
      - the skill is connected with reason manual_request
      - without the request it is not connected by any implicit rule
  - id: AC-SKILL-LEGACY-FIELD
    title: Migrate legacy skill metadata
    given: a v0.4 skill declares metadata.abcm-context-strategy=scope and metadata.abcm-context-base=workflow
    when: the skill is indexed
    then:
      - scope maps to metadata.abcm-skill-strategy=scope
      - SKILL_CONTEXT_STRATEGY_DEPRECATED is emitted
      - abcm-context-base is ignored and SKILL_CONTEXT_BASE_REMOVED is emitted
  - id: AC-JS-SOURCE-IGNORED
    title: Do not add ordinary JavaScript source files to ScopeMap
    given: project source contains src/index.js and source locator indexing is disabled
    when: buildScopeMap runs
    then:
      - src/index.js is not a DocumentRecord
      - it is not listed in ScopeMapProjection
      - the owning service scope remains discoverable
  - id: AC-SKILL-SCRIPT-RESOURCE
    title: Index a skill JavaScript script as executable metadata
    given: agents/skills/review/scripts/run.js exists
    when: buildScopeMap runs
    then:
      - run.js becomes an ExecutableResourceRecord
      - its body is not added to ordinary context
      - the skill resource requires activation and permissions before execution
  - id: AC-DOC-MIRROR-DELETE
    title: Propagate source documentation deletion in mirror mode
    given: docs/adr/ADR-001.md is mirrored into ABCM
    when: the source file is deleted and synchronization runs
    then:
      - the active mirror file is removed
      - a tombstone and provenance record remain in SQLite
      - a new MapRevision no longer exposes the document
  - id: AC-DOC-CUTOVER
    title: Move repository documentation to managed ABCM storage
    given: a mirror source has no conflicts and a final sync matches checksums
    when: an operator applies cutover
    then:
      - ABCM copies become managed canonical documents
      - source deletion propagation is disabled
      - ABCM does not modify or delete repository files
terminologyPolicy:
  humanNotation: <русский термин> (<EnglishInvariant>)
  purpose: Human-facing algorithms use a Russian term followed by one stable English invariant. Machine fields use the 
    invariant or a documented camelCase derivative.
  rules:
    - The first occurrence of every domain term in a section MUST use RussianTerm (EnglishInvariant).
    - Algorithm phase and step names MUST expose both nameRu and invariant.
    - The English invariant MUST remain stable across translations and UI surfaces.
    - Entity invariants use PascalCase; public method invariants retain their published camelCase names.
    - A synonym MAY be used in prose only after it has been mapped to the canonical invariant in the glossary.

glossary:
  - termRu: рабочее пространство
    invariant: Workspace
    definition: One root directory managed by one ABCM service instance; contains exactly one root workflow scope.
    definitionRu: Одна корневая директория под управлением одного экземпляра ABCM; содержит ровно один корневой workflow
      scope.
  - termRu: файловое рабочее пространство
    invariant: FileWorkspace
    definition: The human-editable filesystem representation that remains the canonical source of authored content.
    definitionRu: Человекочитаемое представление workspace в файловой системе, которое остаётся каноническим источником 
      пользовательского содержимого.
  - termRu: область
    invariant: Scope
    definition: A directory containing scope.yaml and participating in the workflow-project-service-feature hierarchy.
    definitionRu: Каталог с файлом scope.yaml, участвующий в иерархии workflow-project-service-feature.
  - termRu: тип области
    invariant: ScopeKind
    definition: One of workflow, project, service or feature.
    definitionRu: 'Один из четырёх типов: workflow, project, service или feature.'
  - termRu: манифест области
    invariant: ScopeManifest
    definition: The scope.yaml file that defines stable identity and kind but not the parent.
    definitionRu: Файл scope.yaml с устойчивой идентичностью и типом области; родитель в нём не задаётся.
  - termRu: путь области
    invariant: ScopePath
    definition: The ordered physical ancestor chain from workflow to a target scope.
    definitionRu: Упорядоченная цепочка физических предков от workflow до целевой области.
  - termRu: карта областей
    invariant: ScopeMap
    definition: The versioned graph of valid and invalid scopes, relations, readiness and diagnostics.
    definitionRu: Версионированный граф областей, связей, готовности и диагностик.
  - termRu: ревизия карты
    invariant: MapRevision
    definition: An immutable published snapshot of ScopeMap and its indexes.
    definitionRu: Неизменяемый опубликованный снимок ScopeMap и связанных индексов.
  - termRu: проекция карты
    invariant: ScopeMapProjection
    definition: A permission-filtered agent or admin representation of one MapRevision.
    definitionRu: Отфильтрованное по доступу агентное или административное представление одной MapRevision.
  - termRu: узел карты
    invariant: ScopeNode
    definition: A typed scope record in ScopeMap.
    definitionRu: Типизированная запись области в ScopeMap.
  - termRu: связь области
    invariant: ScopeRelation
    definition: A structural or explicit edge between scopes or between a scope and an artifact.
    definitionRu: Структурная или явная связь между областями либо между областью и артефактом.
  - termRu: недопустимая ветка
    invariant: InvalidBranch
    definition: A scope subtree that violates hierarchy or manifest requirements and is excluded from active resolution.
    definitionRu: Поддерево, нарушающее иерархию или требования манифеста; исключается из активного resolver graph.
  - termRu: готовность области
    invariant: ScopeReadiness
    definition: The readiness state for map display and task-context construction.
    definitionRu: Состояние готовности области к отображению в карте и построению task context.
  - termRu: аренда сканирования
    invariant: ScanLease
    definition: A time-bounded single-writer lease protecting map construction.
    definitionRu: Ограниченная по времени single-writer аренда, защищающая построение карты от параллельной публикации.
  - termRu: сеанс сканирования
    invariant: ScanSession
    definition: One traceable execution of workspace discovery and indexing.
    definitionRu: Один трассируемый запуск обнаружения, валидации и индексирования workspace.
  - termRu: запись файла
    invariant: FileRecord
    definition: 'Indexed metadata for a physical file: path, checksum, timestamps, classification and parse status.'
    definitionRu: 'Индексированная запись физического файла: путь, размер, время изменения, checksum и состояние разбора.'
  - termRu: запись документа
    invariant: DocumentRecord
    definition: A semantic FileRecord with artifact id, kind, lifecycle, selectors, links and context metadata.
    definitionRu: Семантическая запись документа с id, kind, lifecycle, selectors, links и context metadata.
  - termRu: конвенция доменного языка
    invariant: DomainLanguageConvention
    definition: The authored domain and naming convention present in every scope, including inherit-only documents.
    definitionRu: Авторская доменная и naming-конвенция, присутствующая в каждой области, включая inherit-only вариант.
  - termRu: начальная доменная проекция
    invariant: DomainLanguageBootstrap
    definition: A compact workflow-plus-project domain-language projection returned before task path resolution.
    definitionRu: Компактная проекция доменного языка workflow + project, получаемая до окончательного разрешения task 
      path.
  - termRu: эффективный доменный язык
    invariant: EffectiveDomainLanguage
    definition: The merged workflow-project-service-feature domain language for a resolved path.
    definitionRu: Результат слияния workflow-project-service-feature конвенций для уже разрешённого пути.
  - termRu: рабочая привязка
    invariant: ContextAnchor
    definition: The minimal workspace and project identity used before the final task path is known.
    definitionRu: Минимальная привязка к workspace и project, используемая до определения итогового пути задачи.
  - termRu: нормализованное намерение задачи
    invariant: NormalizedTaskIntent
    definition: The goal, canonical domains, terms, links and hints after domain-language normalization.
    definitionRu: Цель, канонические домены, термины, ссылки и hints после нормализации через доменный язык.
  - termRu: стратегия подключения skill
    invariant: SkillConnectionStrategy
    definition: 'The rule that determines when and by which evidence a skill is connected: global, scope, by-link, by-description
      or manual.'
    definitionRu: 'Правило, определяющее, в какой ситуации и по какому основанию skill подключается: global, scope, by-link,
      by-description или manual.'
  - termRu: дескриптор skill
    invariant: SkillDescriptor
    definition: Compact indexed skill metadata used for discovery before the full SKILL.md body is loaded.
    definitionRu: Компактные индексированные metadata skill, используемые для обнаружения до загрузки полного SKILL.md.
  - termRu: подключённый skill
    invariant: ConnectedSkillRecord
    definition: A reproducible record of one skill connected to a task, including source scope, digest, strategy and 
      reasons.
    definitionRu: Воспроизводимая запись skill, подключённого к задаче, с source scope, digest, strategy и причинами.
  - termRu: причина подключения skill
    invariant: SkillConnectionReason
    definition: A stable code explaining why a skill was connected.
    definitionRu: Стабильный код, объясняющий, почему skill был подключён.
  - termRu: требование skill к контексту
    invariant: SkillContextRequirement
    definition: A required kind, tag or explicit link contributed by a connected skill to document collection.
    definitionRu: Kind, tag или explicit link, который подключённый skill добавляет к сбору документов.
  - termRu: универсум областей-кандидатов
    invariant: CandidateScopeUniverse
    definition: The server-side set of scopes eligible for optional path and document matching.
    definitionRu: Внутренний серверный набор областей, допустимых для поиска пути и релевантных документов.
  - termRu: разрешённый путь области
    invariant: ResolvedScopePath
    definition: The selected primary target path plus affected scopes and the evidence used to resolve them.
    definitionRu: Выбранная основная область, затрагиваемые области, цепочка предков и основания выбора.
  - termRu: основная целевая область
    invariant: PrimaryTargetScope
    definition: The scope that owns the main change or task outcome.
    definitionRu: Область, которой принадлежит основное изменение или ожидаемый результат задачи.
  - termRu: затрагиваемая область
    invariant: AffectedScope
    definition: An additional scope whose contracts or artifacts are relevant but which is not the primary target.
    definitionRu: Дополнительная область, чьи контракты или артефакты затрагиваются задачей.
  - termRu: кандидат документа
    invariant: DocumentCandidate
    definition: A document eligible for selection before conflict, access, lifecycle and budget processing.
    definitionRu: Документ, допущенный к отбору до обработки access, lifecycle, conflicts и budget.
  - termRu: причина выбора
    invariant: SelectionReason
    definition: A stable code explaining why a document was selected or omitted.
    definitionRu: Стабильный код, объясняющий включение или исключение документа.
  - termRu: проекция документа
    invariant: DocumentProjection
    definition: 'The materialization mode used in a bundle: full, section, summary, metadata or reference.'
    definitionRu: 'Способ представления документа в bundle: full, section, summary, metadata или reference.'
  - termRu: профиль бюджета
    invariant: BudgetProfile
    definition: The soft and hard token limits plus projection and omission rules for one build class.
    definitionRu: Soft/hard limits и правила проекции/исключения для определённого класса сборки.
  - termRu: пакет контекста
    invariant: ContextBundle
    definition: An immutable task-specific manifest plus materialized context content.
    definitionRu: Неизменяемый task-specific manifest и материализованный контекст.
  - termRu: отпечаток контекста
    invariant: ContextFingerprint
    definition: A reproducibility record containing revisions, checksums, projections and selected files without 
      duplicating every body.
    definitionRu: Запись воспроизводимости с revisions, checksums, projections и selected files без копирования всех 
      тел.
  - termRu: трасса разрешения
    invariant: ResolverTrace
    definition: A diagnostic trace of normalization, path scoring, selection, conflict and budget decisions.
    definitionRu: Диагностическая трасса нормализации, оценки пути, отбора, conflicts и budget decisions.
  - termRu: явная ссылка
    invariant: ExplicitLink
    definition: A stable abcm:// URI that directly names a scope, artifact, plan or architecture document.
    definitionRu: Стабильный abcm:// URI, прямо указывающий область, артефакт, план или архитектурный документ.
  - termRu: исполняемый ресурс
    invariant: ExecutableResource
    definition: A script or executable file associated with a skill, eval or statistics job and governed by activation 
      and permission rules.
    definitionRu: Скрипт или исполняемый файл skill/eval/statistics job, управляемый правилами активации и доступа.
  - termRu: запись исполняемого ресурса
    invariant: ExecutableResourceRecord
    definition: Metadata for an executable resource; not an ordinary context document body.
    definitionRu: Metadata исполняемого ресурса; не обычное тело context document.
  - termRu: индекс путей исходного кода
    invariant: SourceLocatorIndex
    definition: An optional metadata-only index used to map source paths and components to scopes.
    definitionRu: Опциональный metadata-only индекс для сопоставления путей кода и компонентов с областями.
  - termRu: запись пути исходного кода
    invariant: SourceLocatorRecord
    definition: A source-path metadata record without source body content.
    definitionRu: Metadata-запись пути исходного кода без содержимого файла.
  - termRu: источник документации
    invariant: DocumentationSource
    definition: A configured external directory or repository whose documentation can be mirrored into ABCM.
    definitionRu: Настроенная внешняя директория или repository, документация которого может зеркалироваться в ABCM.
  - termRu: режим хранения документа
    invariant: StorageMode
    definition: 'The canonical-location mode: managed or mirror.'
    definitionRu: 'Режим канонического расположения документа: managed или mirror.'
  - termRu: управляемый режим
    invariant: ManagedMode
    definition: A storage mode in which the ABCM workspace copy is canonical.
    definitionRu: Режим, в котором канонична копия в ABCM workspace.
  - termRu: зеркальный режим
    invariant: MirrorMode
    definition: A one-way mode in which an external source is canonical and the ABCM copy is synchronized.
    definitionRu: Односторонний режим, где каноничен внешний источник, а копия ABCM синхронизируется.
  - termRu: происхождение документа
    invariant: DocumentProvenance
    definition: Source id, source path, revision and checksum proving where a mirrored document came from.
    definitionRu: Source id, path, revision и checksum, фиксирующие происхождение mirrored document.
  - termRu: план импорта документации
    invariant: DocumentationImportPlan
    definition: A non-mutating preview of mappings, creates, updates, deletes and conflicts.
    definitionRu: Неизменяющий preview сопоставлений, созданий, изменений, удалений и конфликтов.
  - termRu: передача канонического владения
    invariant: DocumentationCutover
    definition: An operator-controlled transition from mirror mode to managed mode after final synchronization and 
      checksum verification.
    definitionRu: Управляемый оператором переход из mirror mode в managed mode после финальной синхронизации и проверки 
      checksums.
  - termRu: надгробная запись
    invariant: Tombstone
    definition: A derived record preserving identity and deletion provenance after an active mirrored file is removed.
    definitionRu: Производная запись, сохраняющая identity и происхождение удаления после удаления active mirror.
