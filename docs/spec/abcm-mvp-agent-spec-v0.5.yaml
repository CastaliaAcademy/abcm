    --> D[TopologyValidation]\n  D -->|invalid| E[InvalidBranch + MapDiagnostic]\n  D -->|valid| F[DocumentIndexing]\n  F
    --> G[RelationsAndReadiness]\n  G --> H[StagedMapRevision]\n  H --> I[AtomicPublish]\n  I --> J[AgentProjection]\n  I
    --> K[AdminProjection]"
  dynamicContextMermaid: "flowchart TD\n  S[StorageParts] --> M[IndexesAndScopeMap]\n  M --> N[IntentNormalization]\n  N -->
    P[ResolvedScopePath]\n  P --> DL[EffectiveDomainLanguage]\n  DL --> SK[SkillConnectionResolution]\n  SK --> CS[ConnectedSkills]\n\
    \  CS --> KR[SkillContextRequirements]\n  P --> A[MandatorySet]\n  P --> R[RelevantCandidates]\n  KR --> A\n  A --> C[ConflictResolution]\n\
    \  R --> C\n  C --> D[DocumentProjection]\n  D --> B[ContextBudget]\n  CS --> O[ContextBundle]\n  B --> O\n  O --> F[ContextFingerprint]\n"

# 4. Построение и представление пакета контекста (ContextBundleConstructionAndRepresentation)
  fileClassificationMermaid: "flowchart TD\n  F[Physical file] --> C{Classification}\n  C -->|scope.yaml/config/docs| D[FileRecord
    + DocumentRecord]\n  C -->|skill/eval script| E[ExecutableResourceRecord]\n  C -->|ordinary .js/.ts/.py| S{Source index
    enabled?}\n  S -->|no| I[Ignored by context index]\n  S -->|yes| L[SourceLocatorRecord metadata only]\n  C -->|generated/build/cache|
    G[Excluded]\n  D --> M[MapRevision internal index]\n  E --> M\n  L --> M\n  M --> P[ScopeMapProjection: scopes + summaries,
    no source tree]\n"
  documentationMigrationMermaid: "flowchart LR\n  R[Repository: docs beside code] --> P[Import preview]\n  P -->|approved|
    M[Mirror mode: one-way sync]\n  M --> A[ABCM workspace copy + provenance]\n  M -->|source delete| T[Remove active mirror
    + tombstone]\n  A --> C{Keep repository canonical?}\n  C -->|yes| M\n  C -->|no, operator cutover| V[Final sync + checksum
    verification]\n  V --> G[Managed mode: ABCM canonical]\n  G --> X[Repository cleanup or pointer is external/manual]\n"
  skillConnectionMermaid: "flowchart LR\n  C[SkillDescriptor catalog] --> R[SkillConnectionResolver]\n  P[ResolvedScopePath]
    --> R\n  I[NormalizedTaskIntent] --> R\n  L[Role/assignment links] --> R\n  M[requestedSkillIds] --> R\n  R --> G[global]\n\
    \  R --> S[scope]\n  R --> B[by-link]\n  R --> D[by-description]\n  R --> X[manual]\n  G --> O[ConnectedSkillRecord]\n\
    \  S --> O\n  B --> O\n  D --> O\n  X --> O\n  O --> K[SKILL.md + context requirements + resource refs]\n  K --> CB[ContextBundle]\n"
