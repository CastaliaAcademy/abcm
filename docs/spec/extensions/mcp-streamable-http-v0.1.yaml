apiVersion: abcm.dev/spec-extension/v1alpha1
kind: McpStreamableHttpExtension
metadata:
  id: mcp-streamable-http
  version: 0.1.0
  status: implemented-alpha
  extends: abcm-file-workspace-mvp@0.5.0
requirements:
  - id: MCPHTTP-001
    statement: The reference HTTP server MUST expose MCP Streamable HTTP at a configurable path, defaulting to /mcp.
  - id: MCPHTTP-002
    statement: REST, stdio MCP, and HTTP MCP MUST delegate to the same application services and filesystem policy.
  - id: MCPHTTP-003
    statement: The alpha HTTP MCP endpoint MUST require the configured static Bearer token.
  - id: MCPHTTP-004
    statement: The HTTP MCP adapter MUST validate Host and any present Origin against explicit allowlists before dispatch.
  - id: MCPHTTP-005
    statement: The adapter MUST serve the specification baseline 2025 protocol without maintaining a second tool definition.
  - id: MCPHTTP-006
    statement: MCP tools SHOULD declare read-only and destructive behavior annotations for client-side action controls.
securityBoundary:
  productionDefault: loopback-only
  publicInternetExposure: prohibited_for_static_token_alpha
  chatgptConnectionRequires:
    - remote HTTPS reachability through an approved tunnel or reverse proxy
    - an authentication mechanism supported by the ChatGPT workspace
acceptance:
  - id: AC-MCPHTTP-REAL-CLIENT
    given: A real Streamable HTTP MCP client and a valid Bearer token
    when: The client discovers tools and writes a managed file
    then: The write is observable through REST in the same runtime
  - id: AC-MCPHTTP-AUTH-HOST-ORIGIN
    given: Missing credentials or an unapproved Host or Origin
    when: A request reaches /mcp
    then: The request is rejected before MCP tool dispatch
