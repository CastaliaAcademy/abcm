extension:
  id: rest-openapi-parity
  version: 0.1.0
  baseSpecVersion: 0.5.0
  status: approved-for-alpha

requirements:
  ROP-001:
    statement: The REST adapter shall expose every implemented normative v1 operation without containing context-selection or filesystem business rules.
  ROP-002:
    statement: JSON request and response schemas shared with MCP shall be derived from the same exported Zod contracts.
  ROP-003:
    statement: The server shall expose a deterministic OpenAPI 3.1 document at GET /openapi.json.
  ROP-004:
    statement: The committed OpenAPI artifact shall be reproducibly generated and checked byte-for-byte in tests.
  ROP-005:
    statement: The OpenAPI contract shall declare bearer authentication, ABCM Problem Details, checksums, binary file bodies, and all implemented v1 paths.
  ROP-006:
    statement: Equal principal, canonical state, and semantic operation shall return equal bytes, checksums, revision digests, and ABCM error codes through REST and MCP.
  ROP-007:
    statement: REST JSON bodies shall reject unknown fields through the same strict schemas used by MCP where the operation payload is shared.
  ROP-008:
    statement: Documentation cutover shall not be advertised until its M10 application use case is implemented and verified.

artifacts:
  endpoint: /openapi.json
  snapshot: docs/api/openapi-v1.json
  generator: bun run openapi:generate
