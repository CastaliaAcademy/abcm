apiVersion: abcm.dev/spec-extension/v1alpha1
kind: SpecExtension
metadata:
  id: rest-static-auth
  version: 0.1.0
  status: alpha
  extends: rest-file-management@0.1.0
requirements:
  - id: AUTH-001
    statement: Every REST endpoint except GET /health MUST require a Bearer token configured at process startup.
  - id: AUTH-002
    statement: Missing or invalid credentials MUST return 401 application/problem+json with code AUTHENTICATION_REQUIRED and WWW-Authenticate Bearer.
  - id: AUTH-003
    statement: The server MUST refuse to start without ABCM_API_TOKEN and MUST reject configured tokens shorter than 16 characters.
acceptance:
  - id: AC-AUTH-BOUNDARY
    covers: [AUTH-001, AUTH-002]
    evidence: Automated wrapper and real HTTP listener tests.
  - id: AC-AUTH-CONFIG
    covers: [AUTH-003]
    evidence: Runtime validation and CLI startup contract.
limitations:
  - The alpha profile has one static token and no per-principal authorization policy.
