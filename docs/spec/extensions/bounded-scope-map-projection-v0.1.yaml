apiVersion: abcm.dev/spec/v1alpha1
kind: SpecificationExtension
metadata:
  name: bounded-scope-map-projection
  version: 0.1.0
  status: approved-for-alpha
  extends: abcm-file-workspace-mvp@0.5.0
  changeReason: Define the alpha access input and disclosure boundary for bounded ScopeMap projections.

requirements:
  - id: BSP-001
    level: MUST
    statement: A projection MUST require effective scope.discover and scope.read_metadata permissions for every selected scope.
  - id: BSP-002
    level: MUST
    statement: Admin projections and includeInvalid=true MUST require workspace-level scope_map.read_full permission.
  - id: BSP-003
    level: MUST
    statement: rootScopeId MUST resolve a canonical scope id or alias, depth MUST be a non-negative integer, and both bounds MUST be applied before disclosure.
  - id: BSP-004
    level: MUST
    statement: Locally granted descendants MUST include only the minimal path-only ancestor chain needed to locate them.
  - id: BSP-005
    level: MUST_NOT
    statement: Relations, warnings, direct-child identifiers, or resource summaries MUST disclose inaccessible scopes or files outside the bounded selection.
  - id: BSP-006
    level: MUST
    statement: REST and MCP map resources MUST use the same projection service and effective access input.
  - id: BSP-007
    level: MUST_NOT
    statement: ScopeMapProjection MUST contain document bodies, individual file paths, or ordinary source-file inventory.

acceptanceScenarios:
  - id: AC-BSP-LOCAL-GRANT
    given: A principal has discover and metadata grants only on one service and its feature.
    when: The principal requests the service root at depth zero.
    then:
      - the service is selected
      - the workflow and project are path-only ancestors
      - the sibling service and feature are absent
  - id: AC-BSP-PERMISSION-MATRIX
    given: Principals independently lack metadata or full-map permission.
    when: They request agent and admin projections.
    then:
      - missing discover or metadata returns ACCESS_DENIED
      - admin and invalid-branch access without full-map returns ACCESS_DENIED
  - id: AC-BSP-PARITY
    given: REST and MCP receive the same effective access grants.
    when: Both request the agent map.
    then:
      - both expose the same visible scope set
      - neither exposes inaccessible scope or file metadata
