extension:
  id: rest-request-boundaries
  version: 0.1.0
  baseSpecVersion: 0.5.0
  status: approved-for-alpha

requirements:
  RRB-001:
    statement: Every protected REST request shall consume one process-local fixed-window rate-limit slot before dispatch; health probes shall remain exempt.
  RRB-002:
    statement: Rate-limit exhaustion shall return REST_RATE_LIMIT_EXCEEDED with HTTP 429, Problem Details, and Retry-After without invoking an application use case.
  RRB-003:
    statement: Request bodies shall be read incrementally and cancelled as soon as the configured byte limit is exceeded, including when Content-Length is absent.
  RRB-004:
    statement: Client cancellation and the deployment request deadline shall propagate through body parsing and application services to their existing commit boundaries.
  RRB-005:
    statement: Pre-commit cancellation and timeout shall return stable REST_REQUEST_CANCELLED and REST_REQUEST_TIMEOUT problems without changing canonical or derived state.
  RRB-006:
    statement: A multi-file documentation commit that has crossed its non-preemptible boundary shall complete consistently and report its actual result.
  RRB-007:
    statement: Body size, request timeout, and requests-per-minute limits shall have safe defaults, bounded validation, runtime options, and documented environment variables.
  RRB-008:
    statement: OpenAPI shall advertise 413, 429, 499, and 504 problems and the Retry-After response header.

configuration:
  maxRequestBodyBytes:
    environment: ABCM_REST_MAX_REQUEST_BODY_BYTES
    default: 1048576
    maximum: 16777216
  requestTimeoutMs:
    environment: ABCM_REST_REQUEST_TIMEOUT_MS
    default: 30000
    maximum: 300000
  maxRequestsPerMinute:
    environment: ABCM_REST_MAX_REQUESTS_PER_MINUTE
    default: 600
    maximum: 100000
