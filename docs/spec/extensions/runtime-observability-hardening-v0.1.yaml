apiVersion: abcm.dev/v1alpha1
kind: RequirementExtension
metadata:
  id: runtime-observability-hardening-v0.1
  version: 0.1.0
  status: draft
requirements:
  - id: OBS-001
    level: MUST
    statement: Runtime audit events MUST use a fixed body-free schema and MUST NOT contain authorization credentials or document content.
  - id: OBS-002
    level: MUST
    statement: Scope-map scan, path resolution, context construction, and documentation synchronization MUST emit bounded operation metrics.
  - id: OBS-003
    level: MUST
    statement: A telemetry sink failure MUST NOT change the result of the observed ABCM operation.
  - id: SEC-001
    level: MUST
    statement: Files larger than the configured indexing limit MUST NOT be read into memory by ScopeMap indexing.
  - id: SEC-002
    level: MUST
    statement: Oversized indexed files MUST produce metadata-only FILE_TOO_LARGE diagnostics without exposing file content.
  - id: SEC-003
    level: MUST
    statement: YAML and frontmatter parsing MUST remain data-only, size-bounded, schema-validated, and free of executable resource activation.
acceptanceScenarios:
  - id: AC-OBS-BODY-FREE
    given: operations process a document body and a bearer token
    when: audit and metric events are collected
    then:
      - no event contains either secret value
      - operation outcome and duration remain observable
  - id: AC-OVERSIZED-INDEX
    given: a managed document exceeds maxIndexBytes
    when: ScopeMap is scanned
    then:
      - the document body is not parsed or indexed
      - a FILE_TOO_LARGE diagnostic identifies only its path and configured size boundary
      - valid sibling content remains available
