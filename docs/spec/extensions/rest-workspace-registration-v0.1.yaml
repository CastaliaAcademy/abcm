apiVersion: abcm.dev/spec/v1alpha1
kind: SpecificationExtension
metadata:
  name: rest-workspace-registration
  version: 0.1.0
  status: approved-for-alpha
  extends: abcm-file-workspace-mvp@0.5.0
  changeReason: Register managed workspaces through REST without accepting arbitrary host filesystem roots.

productBoundaryDelta:
  owns:
    - authenticated managed-workspace registration
    - deterministic workspace-root allocation beneath one configured store root
    - minimal valid workflow bootstrap
    - restart discovery of managed workspace directories
  doesNotOwn:
    - arbitrary host path registration
    - workspace deletion
    - external repository import without preview and checksum verification

invariants:
  - id: REST-WS-I01
    statement: A registered workspace root MUST be allocated by the server beneath ABCM_WORKSPACE_STORE_ROOT.
  - id: REST-WS-I02
    statement: A client MUST NOT provide an absolute or relative filesystem root.
  - id: REST-WS-I03
    statement: Workspace creation MUST NOT overwrite an existing directory or registry entry.
  - id: REST-WS-I04
    statement: A created workspace MUST contain a workflow scope manifest and DomainLanguageConvention.
  - id: REST-WS-I05
    statement: A successfully registered workspace MUST be immediately usable by existing REST file and ScopeMap methods.

methods:
  registerWorkspace:
    rest:
      method: POST
      path: /v1/workspaces
    input:
      required: [id]
      optional: [name]
      forbidden: [root, path]
    output: WorkspaceRegistration

errors:
  - code: WORKSPACE_ALREADY_EXISTS
    severity: conflict
  - code: WORKSPACE_REGISTRATION_DISABLED
    severity: configuration_error
  - code: REQUEST_INVALID
    severity: request_error

requirements:
  - id: WSR-001
    level: MUST
    statement: REST MUST register a workspace and make it immediately available to existing workspace methods.
  - id: WSR-002
    level: MUST_NOT
    statement: REST MUST NOT accept or derive a workspace root outside ABCM_WORKSPACE_STORE_ROOT.
  - id: WSR-003
    level: MUST
    statement: Duplicate workspace ids or existing target directories MUST fail without changing existing content.
  - id: WSR-004
    level: MUST
    statement: Registration MUST create the minimum valid workflow metadata required by ScopeMap.
  - id: WSR-005
    level: MUST
    statement: Managed workspace directories MUST be discoverable after service restart.
  - id: WSR-006
    level: MUST
    statement: Registration errors MUST use the stable ABCM JSON problem shape.

acceptanceScenarios:
  - id: AC-WSR-CREATE
    given: An empty configured workspace store
    when: A client registers castalia-public
    then:
      - REST returns 201
      - the root is allocated below the store
      - the workflow is ready for project creation
  - id: AC-WSR-BOUNDARY
    given: A client supplies an invalid id or host path fields
    when: registration is requested
    then:
      - REST returns REQUEST_INVALID
      - no path outside the store is created
  - id: AC-WSR-DUPLICATE
    given: A workspace id or target directory already exists
    when: registration is repeated
    then:
      - REST returns WORKSPACE_ALREADY_EXISTS
      - existing bytes remain unchanged
  - id: AC-WSR-RESTART
    given: A managed workspace was registered
    when: workspace definitions are rediscovered after restart
    then:
      - the same id and root are loaded
      - existing content remains canonical
