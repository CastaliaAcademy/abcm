apiVersion: abcm.dev/spec/v1alpha1
kind: SpecificationExtension
metadata:
  name: scope-content-indexes
  version: 0.1.0
  status: approved-for-alpha
  extends: abcm-file-workspace-mvp@0.5.0
  changeReason: Define the first bounded MAP-P4 and SQLite v3 vertical slice.

requirements:
  - id: IDX-001
    level: MUST
    statement: A full scan MUST produce deterministic FileRecord metadata for allowed managed-root files and MUST exclude ignored, generated, reserved-service, and ordinary source files.
  - id: IDX-002
    level: MUST
    statement: Every indexed file checksum MUST be computed from canonical filesystem bytes and no authored body may be persisted in SQLite.
  - id: IDX-003
    level: MUST
    statement: Valid artifact frontmatter MUST produce a DocumentRecord whose stable documentId is independent of its filename.
  - id: IDX-004
    level: MUST
    statement: Duplicate document ids MUST produce DOCUMENT_ID_DUPLICATE diagnostics and ambiguous duplicates MUST be excluded from the active document index.
  - id: IDX-005
    level: MUST
    statement: Skill, eval, and statistics scripts MUST produce metadata-only ExecutableResourceRecord entries and MUST NOT produce DocumentRecord entries.
  - id: IDX-006
    level: MUST_NOT
    statement: Ordinary project source files MUST NOT enter FileRecord or DocumentRecord indexes while SourceLocatorIndex is disabled.
  - id: IDX-007
    level: MUST
    statement: SQLite schema v3 MUST atomically persist file, document, and executable-resource rows for the same MapRevision before its active pointer is switched.
  - id: IDX-008
    level: MUST_NOT
    statement: ScopeMapProjection MUST NOT expose indexed file paths, document bodies, or executable resource paths; only aggregate counts may be returned.

acceptanceScenarios:
  - id: AC-IDX-ARTIFACT-RENAME
    given: A valid ADR with document id ADR-0001 is indexed and then renamed.
    when: ScopeMap is rebuilt.
    then:
      - exactly one document with id ADR-0001 remains
      - its relative path changes
      - its checksum and semantic metadata remain bound to the same stable id
  - id: AC-IDX-SOURCE-BOUNDARY
    given: A scope contains ordinary src/index.js and agents/skills/review/scripts/run.js.
    when: ScopeMap is rebuilt with SourceLocatorIndex disabled.
    then:
      - src/index.js is absent from file and document indexes
      - run.js is present only as executable metadata
      - public ScopeMap projections expose neither path nor body
  - id: AC-IDX-SQLITE-ATOMIC
    given: A scan produces scopes, files, documents, and executable resources.
    when: The revision is published.
    then:
      - all derived rows reference the published revision
      - the active pointer never references a partial content index
      - deleting SQLite and rescanning rebuilds equivalent indexes
