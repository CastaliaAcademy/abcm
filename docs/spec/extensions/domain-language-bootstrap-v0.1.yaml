apiVersion: abcm.dev/spec/v1alpha1
kind: SpecificationExtension
metadata:
  name: domain-language-bootstrap
  version: 0.1.0
  status: approved-for-alpha
  extends: abcm-file-workspace-mvp@0.5.0
  changeReason: Define deterministic structured convention schemas and the alpha principal/bootstrap state boundary.

requirements:
  - id: DLB-001
    level: MUST
    statement: getDomainLanguage MUST accept a workspaceId plus canonical project id or alias and MUST require context.build, scope.discover, and scope.read_metadata for the project.
  - id: DLB-002
    level: MUST
    statement: Bootstrap construction MUST pin one active MapRevision and load only workflow and project DomainLanguageConvention sources.
  - id: DLB-003
    level: MUST
    statement: Structured domains.yaml, glossary.yaml, aliases.yaml, and naming.yaml MUST be strict YAML documents with versioned kinds; inherit-only scopes MUST NOT add structured definitions.
  - id: DLB-004
    level: MUST
    statement: Merge order MUST be workflow then project; a locked domain or concept MUST NOT be changed by a descendant.
  - id: DLB-005
    level: MUST
    statement: A bootstrap MUST be bound to principal id, anchor, role, MapRevision, source paths and checksums, creation time, and expiry.
  - id: DLB-006
    level: MUST
    statement: The bootstrap digest MUST be deterministic for the same principal, anchor, role, MapRevision, source checksums, and effective language.
  - id: DLB-007
    level: MUST
    statement: Bootstrap validation MUST reject a different principal, expiry, changed active MapRevision, or changed source bytes.
  - id: DLB-008
    level: MUST
    statement: REST and MCP MUST delegate to the same bootstrap service and return the same effective language and digest.

acceptanceScenarios:
  - id: AC-DLB-BASE-MERGE
    given: A workflow defines locked commerce concepts and its project defines aliases and naming rules.
    when: An authorized principal requests the project bootstrap.
    then:
      - workflow and project sources are pinned and merged in order
      - service convention sources are absent
      - repeated requests have the same bootstrap digest
  - id: AC-DLB-STALE
    given: A bootstrap exists for one principal and source checksum set.
    when: the principal, revision, expiry, or source bytes differ.
    then:
      - validation rejects the bootstrap
      - no stale effective language is returned
