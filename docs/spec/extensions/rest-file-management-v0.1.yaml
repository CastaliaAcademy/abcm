apiVersion: abcm.dev/spec/v1alpha1
kind: SpecificationExtension
metadata:
  name: rest-file-management
  version: 0.1.0
  status: approved-for-alpha
  extends: abcm-file-workspace-mvp@0.5.0
  changeReason: Manage project files through REST in addition to direct or network filesystem access.

productBoundaryDelta:
  owns:
    - authenticated project file listing and metadata reads
    - authenticated file content reads
    - atomic file create and replacement
    - conditional file deletion and move
    - directory creation
  doesNotOwn:
    - source code execution
    - recursive directory deletion
    - arbitrary host filesystem access
    - bypass of scope, access, storage-mode, or reserved-path policies

invariants:
  - id: REST-FILE-I01
    statement: REST and filesystem access MUST operate on the same canonical bytes under one configured workspace root.
  - id: REST-FILE-I02
    statement: Every REST path MUST be workspace-relative and MUST remain beneath the workspace root after normalization and symlink resolution.
  - id: REST-FILE-I03
    statement: REST writes MUST use temporary-file plus atomic-rename semantics and trigger reconciliation.
  - id: REST-FILE-I04
    statement: REST MUST NOT expose .git, .abcm, credentials, ignored dependencies, build output, or paths denied by access policy.
  - id: REST-FILE-I05
    statement: A client MAY use checksum preconditions; a stale precondition MUST fail without changing bytes.
  - id: REST-FILE-I06
    statement: Ordinary source files managed through REST MUST NOT become DocumentRecords unless separately classified by ScopeMap policy.

methods:
  listFiles:
    rest:
      method: GET
      path: "/v1/workspaces/{workspaceId}/files"
    query: [path, recursive]
    output: FileEntry[]
  readFile:
    rest:
      method: GET
      path: "/v1/workspaces/{workspaceId}/files/content"
    query: [path]
    output: raw bytes with ETag checksum
  writeFile:
    rest:
      method: PUT
      path: "/v1/workspaces/{workspaceId}/files/content"
    query: [path]
    preconditions: [If-Match, If-None-Match]
    output: FileEntry
  deleteFile:
    rest:
      method: DELETE
      path: "/v1/workspaces/{workspaceId}/files"
    query: [path]
    preconditions: [If-Match]
  moveFile:
    rest:
      method: POST
      path: "/v1/workspaces/{workspaceId}/files/move"
    input: [from, to, overwrite, ifMatch]
  createDirectory:
    rest:
      method: POST
      path: "/v1/workspaces/{workspaceId}/directories"
    input: [path]

errors:
  - code: WORKSPACE_NOT_FOUND
    severity: request_error
  - code: FILE_PATH_INVALID
    severity: request_error
  - code: FILE_PATH_FORBIDDEN
    severity: access_error
  - code: FILE_NOT_FOUND
    severity: request_error
  - code: FILE_ALREADY_EXISTS
    severity: conflict
  - code: FILE_CHECKSUM_MISMATCH
    severity: conflict
  - code: FILE_TOO_LARGE
    severity: request_error
  - code: FILE_TYPE_UNSUPPORTED
    severity: request_error

requirements:
  - id: RFM-001
    level: MUST
    statement: REST MUST support list, read, create, replace, move, delete, and directory creation for allowed workspace paths.
  - id: RFM-002
    level: MUST
    statement: REST and direct filesystem access MUST observe the same canonical file content.
  - id: RFM-003
    level: MUST
    statement: REST writes MUST be atomic.
  - id: RFM-004
    level: MUST_NOT
    statement: REST MUST NOT allow absolute paths, parent traversal, NUL bytes, or symlink escape.
  - id: RFM-005
    level: MUST_NOT
    statement: REST MUST NOT expose reserved or ignored service paths.
  - id: RFM-006
    level: MUST
    statement: ETag and checksum preconditions MUST prevent lost updates.
  - id: RFM-007
    level: MUST
    statement: Successful mutations MUST schedule or perform ScopeMap reconciliation before the returned revision is used.
  - id: RFM-008
    level: MUST
    statement: REST errors MUST use one stable JSON problem shape with ABCM error codes.

acceptanceScenarios:
  - id: AC-RFM-CRUD
    given: an allowed empty directory
    when: a client creates, reads, replaces, moves, lists, and deletes a file
    then: every response and filesystem byte sequence matches the operation order
  - id: AC-RFM-STALE-WRITE
    given: a client holds an old ETag
    when: it replaces or deletes a changed file with If-Match
    then: the request fails with FILE_CHECKSUM_MISMATCH and bytes remain unchanged
  - id: AC-RFM-TRAVERSAL
    given: an absolute, parent-traversal, encoded traversal, NUL, or escaping symlink path
    when: any file method is called
    then: access fails and no outside path is read or changed
  - id: AC-RFM-RESERVED
    given: .git, .abcm, node_modules, dist, build, coverage, or a denied path
    when: it is listed or addressed directly
    then: the path is not disclosed and the operation fails with FILE_PATH_FORBIDDEN
  - id: AC-RFM-FS-PARITY
    given: a REST write succeeds
    when: the file is read directly and through REST
    then: bytes and checksum are identical
